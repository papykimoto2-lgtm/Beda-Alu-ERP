<style>

<script>
/* ============================== CORE / UTILS ============================== */
const { createClient } = supabase;
const sb = createClient(window.SB_CFG.SUPABASE_URL, window.SB_CFG.SUPABASE_ANON_KEY);
let CURRENT_USER = null;
function money(n){ return new Intl.NumberFormat('fr-FR').format(Math.round(n||0)) + ' FCFA'; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function toast(msg, kind){
  const el=document.createElement('div');
  el.className='fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-lg text-sm font-semibold shadow-lg '+(kind==='error'?'bg-red-600 text-white':'bg-gray-900 text-white');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`; }

const STATUT_DEVIS = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},en_cours:{label:'En cours',color:'bg-amber-50 text-amber-700'},accepte:{label:'Accepté',color:'bg-emerald-50 text-emerald-700'},refuse:{label:'Refusé',color:'bg-red-50 text-red-700'},annule:{label:'Annulé',color:'bg-gray-100 text-gray-500'}};
const STATUT_FACTURE = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},payee_partielle:{label:'Payée partielle',color:'bg-amber-50 text-amber-700'},payee:{label:'Payée',color:'bg-emerald-50 text-emerald-700'},annulee:{label:'Annulée',color:'bg-gray-100 text-gray-500'}};
const STATUT_FICHE = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},en_cours:{label:'En cours',color:'bg-amber-50 text-amber-700'},termine:{label:'Terminé',color:'bg-emerald-50 text-emerald-700'}};
function badge(map,key){ const m=map[key]||{label:key,color:'bg-gray-100 text-gray-500'}; return `<span class="badge ${m.color}">${escapeHtml(m.label)}</span>`; }

/* ============================== AUTH ============================== */
let authMode='login';
document.getElementById('toggleSignup').onclick=()=>{
  authMode = authMode==='login' ? 'signup' : 'login';
  document.getElementById('toggleSignup').textContent = authMode==='login' ? 'Première connexion ? Créer un compte administrateur' : '← Retour à la connexion';
  document.querySelector('#loginForm button[type=submit]').textContent = authMode==='login' ? 'Se connecter' : 'Créer le compte';
};
function showAuthMsg(msg,isError){
  const el=document.getElementById('authMsg');
  el.textContent=msg; el.classList.remove('hidden');
  el.className='text-sm rounded-lg px-3 py-2 mb-3 '+(isError?'bg-red-50 text-red-700':'bg-blue-50 text-blue-700');
}
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    if(authMode==='signup'){
      const {error}=await sb.auth.signUp({email,password});
      if(error) throw error;
      showAuthMsg('Compte créé. Connectez-vous.', false);
      authMode='login'; document.getElementById('toggleSignup').click(); document.getElementById('toggleSignup').click();
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      await enterApp();
    }
  }catch(err){ showAuthMsg(err.message||'Erreur', true); }
  finally{ btn.disabled=false; }
});
async function handleLogout(){ await sb.auth.signOut(); CURRENT_USER=null; document.getElementById('appScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); }
async function enterApp(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return;
  CURRENT_USER=user;
  const {data:profile}=await sb.from('profiles').select('nom_complet').eq('id',user.id).maybeSingle();
  const displayName=profile?.nom_complet||user.email;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('sbUserEmail').textContent=user.email;
  document.getElementById('hdrUserName').textContent=displayName;
  document.getElementById('hdrAvatar').textContent=displayName.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const {count:nbAttente}=await sb.from('devis').select('*',{count:'exact',head:true}).eq('statut','en_attente');
  const bell=document.getElementById('hdrBellCount');
  if(nbAttente){ bell.textContent=nbAttente; bell.classList.remove('hidden'); }
  refreshDevisBadges();
  refreshProjetsBadges();
  loadAppParams();
  showPage('dashboard');
}
(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await enterApp();
})();

/* ============================== ROUTING ============================== */

async function showPage(page){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.nav-child').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const groupKey=PAGE_TO_GROUP[page];
  document.querySelectorAll('.nav-parent').forEach(b=>{
    const isMatch=b.dataset.toggle===groupKey;
    if(isMatch){ b.classList.add('open'); document.querySelector(`.sidebar-children[data-children="${groupKey}"]`).classList.add('open'); }
  });
  document.getElementById('pageTitle').textContent=PAGE_TITLES[page]||'';
  const el=document.getElementById('pageContent');
  el.innerHTML='<div class="text-sm text-gray-400 p-8 text-center">Chargement…</div>';
  closeSidebar();
  try{ await PAGE_RENDERERS[page](el); }
  catch(err){ el.innerHTML=`<div class="text-sm text-red-600">${escapeHtml(err.message||String(err))}</div>`; }
}
document.querySelectorAll('.nav-item[data-page], .nav-child[data-page]').forEach(b=>b.onclick=()=>{ if(!b.classList.contains('nav-child')) window._editId=null; showPage(b.dataset.page); });
document.querySelectorAll('.nav-parent[data-toggle]').forEach(b=>{
  b.onclick=()=>{
    const key=b.dataset.toggle;
    const kids=document.querySelector(`.sidebar-children[data-children="${key}"]`);
    const willOpen=!kids.classList.contains('open');
    document.querySelectorAll('.sidebar-children').forEach(c=>c.classList.remove('open'));
    document.querySelectorAll('.nav-parent').forEach(p=>p.classList.remove('open'));
    if(willOpen){ kids.classList.add('open'); b.classList.add('open'); }
  };
});

async function refreshProjetsBadges(){
  const {data,error}=await sb.from('projets').select('etape,date_fin');

  const counts={en_attente:0,mesure_disponible:0,pret_fabrication:0,fabrication_en_cours:0,installation_en_cours:0,termine:0,annule:0,retard:0};
  data.forEach(p=>{

  const setTxt=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  setTxt('badgeProjTotal',data.length);

  setTxt('badgeProjPret',counts.pret_fabrication);
  setTxt('badgeProjFabrication',counts.fabrication_en_cours);
  setTxt('badgeProjInstallation',counts.installation_en_cours);
  setTxt('badgeProjTermine',counts.termine);
  setTxt('badgeProjRetard',counts.retard);
  setTxt('badgeProjAnnule',counts.annule);

function simpleHash(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; }
  return h.toString(16);
}
function printFooterQrHtml(type,code,montant){

async function convertirEnFacture(devisId,type){
  type=type||'simple';
  const {data:d}=await sb.from('devis').select('*').eq('id',devisId).single();
  const label=type==='fne'?'Facture normalisée FNE':'Facture simple';
  if(!confirm(`Générer une ${label} pour le devis ${d.code} (${money(d.total)}) ?`)) return;
  const rec={devis_id:devisId,client_id:d.client_id,total:d.total,created_by:CURRENT_USER.id,type_facture:type};
  if(type==='fne'){
    const cert=await certifierFacturefne(d);
    rec.fne_reference=cert.reference; rec.fne_statut=cert.statut;
  }
  const {error}=await sb.from('factures').insert(rec);
  if(error){ toast(error.message,'error'); return; }
  await sb.from('devis').update({statut:'accepte'}).eq('id',devisId);
  toast(label+' générée'+(type==='fne'?' ('+rec.fne_statut+').':'.')); showPage('devis');
}
async function certifierFacturefne(devis){
  const p=window.APP_PARAMS||await loadAppParams();
  if(!p.fne_actif){ return {reference:'PROV-'+Date.now(),statut:'provisoire'}; }
  const url=p.fne_environnement==='production'?p.fne_url_prod:p.fne_url_test;
  if(!url||!p.fne_api_key) return {reference:'PROV-'+Date.now(),statut:'provisoire'};
  try{
    const res=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+p.fne_api_key,'Content-Type':'application/json'},body:JSON.stringify({pointVente:p.fne_point_vente,etablissement:p.fne_etablissement,montant:devis.total,client:devis.client_id})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json().catch(()=>({}));
    return {reference:json.reference||json.ncc||('FNE-'+Date.now()),statut:'certifiee'};
  }catch(err){
    return {reference:'PROV-'+Date.now(),statut:'provisoire'};
  }
}

async function creerNouvelleFiche(devisId,openAfter){
  const {data:d}=await sb.from('devis').select('*').eq('id',devisId).single();

  if(error){ toast(error.message,'error'); return; }

  const coutMateriel=(lignes||[]).reduce((s,l)=>s+(+l.total||0)*(+l.cout_materiel_pct||60)/100,0);

async function fneTesterConnexion(){

  try{
    const res=await fetch(url,{method:'GET',headers:{'Authorization':'Bearer '+key}});
    el.textContent=`✅ Réponse reçue (HTTP ${res.status}).`; el.className='text-sm mt-3 text-emerald-600';
  }catch(err){
    el.textContent='❌ Appel navigateur bloqué (CORS/mixed-content) — normal en direct : prévoir un relais Supabase Edge Function pour la production.';
    el.className='text-sm mt-3 text-red-600';

}
function switchParamTab(tab){
  document.querySelectorAll('.param-tab-btn').forEach(b=>{ const on=b.dataset.paramtab===tab; b.classList.toggle('bg-indigo-600',on); b.classList.toggle('text-white',on); });
  document.querySelectorAll('.param-tab').forEach(t=>t.classList.toggle('hidden',t.id!=='paramTab-'+tab));
  if(tab==='synchro') refreshSyncCounts();
}
function handleLogoUpload(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    const dataUrl=reader.result;
    const {error}=await sb.from('parametres').update({logo_base64:dataUrl}).eq('id',window.APP_PARAMS.id);
    if(error){ toast(error.message,'error'); return; }
    toast('Logo mis à jour.'); await loadAppParams(); showPage('parametres');
  };
  reader.readAsDataURL(file);
}
async function supprimerLogo(){

  const {error}=await sb.from('parametres').update({logo_base64:null}).eq('id',window.APP_PARAMS.id);

async function testerConnexionSupabase(){
  const el=document.getElementById('sbTestResult');
  el.textContent='Test en cours…'; el.className='text-sm mt-3 text-gray-500';
  const t0=performance.now();
  const {error}=await sb.from('parametres').select('id',{count:'exact',head:true});
  const ms=Math.round(performance.now()-t0);
  if(error){ el.textContent='❌ Échec : '+error.message; el.className='text-sm mt-3 text-red-600'; }
  else { el.textContent=`✅ Connexion OK (${ms} ms)`; el.className='text-sm mt-3 text-emerald-600'; }
}
async function refreshSyncCounts(){
  const el=document.getElementById('syncStatusPanel'); if(!el) return;
  const modules=[['Clients','clients'],['Prospects','prospects'],['Fournisseurs','fournisseurs'],['Projets','projets'],['Devis','devis'],['Factures','factures'],['Produits','produits'],["Fiches d'exécution",'fiches_execution']];
  const t0=performance.now();
  let online=true;
  const rows=await Promise.all(modules.map(async([label,table])=>{
    const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});
    if(error) online=false;
    return {label,count:error?'—':count};
  }));
  const ms=Math.round(performance.now()-t0);
  el.innerHTML=`
    <div class="mb-3">${online?`<span class="text-emerald-600 font-semibold">🟢 En ligne</span> — vérifié en ${ms} ms`:'<span class="text-red-600 font-semibold">🔴 Connexion perturbée</span>'}</div>
    <table><thead><tr><th>Module</th><th class="text-right">Enregistrements</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.label)}</td><td class="text-right font-semibold">${r.count}</td></tr>`).join('')}</tbody></table>
    <div class="text-xs text-gray-400 mt-2">Dernière vérification : ${new Date().toLocaleTimeString('fr-FR')}</div>`;
}
async function exporterSauvegarde(){
  const resEl=document.getElementById('backupResult');
  resEl.textContent='Export en cours…'; resEl.className='text-sm mt-3 text-gray-500';
  try{
    const backup={exported_at:new Date().toISOString(),tables:{}};
    for(const table of BACKUP_TABLES){
      const {data,error}=await sb.from(table).select('*');
      if(error) throw error;
      backup.tables[table]=data;
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`beda-alu-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    await sb.from('parametres').update({derniere_sauvegarde:new Date().toISOString()}).eq('id',window.APP_PARAMS.id);
    await loadAppParams();
    document.getElementById('lastBackupLabel').textContent=fmtDate(window.APP_PARAMS.derniere_sauvegarde);
    resEl.textContent='✅ Export terminé.'; resEl.className='text-sm mt-3 text-emerald-600';
  }catch(err){ resEl.textContent='❌ '+(err.message||err); resEl.className='text-sm mt-3 text-red-600'; }
}
async function importerSauvegarde(e){
  const file=e.target.files[0]; if(!file) return;
  if(!confirm("Importer ce fichier ? Les enregistrements existants portant le même identifiant seront écrasés.")) { e.target.value=''; return; }
  const resEl=document.getElementById('backupResult');
  resEl.textContent='Import en cours…'; resEl.className='text-sm mt-3 text-gray-500';
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    for(const table of BACKUP_TABLES){
      const rows=backup.tables?.[table];
      if(!rows || !rows.length) continue;
      const {error}=await sb.from(table).upsert(rows,{onConflict:'id'});
      if(error) throw new Error(table+' : '+error.message);
    }
    resEl.textContent='✅ Import terminé.'; resEl.className='text-sm mt-3 text-emerald-600';
  }catch(err){ resEl.textContent='❌ '+(err.message||err); resEl.className='text-sm mt-3 text-red-600'; }
  e.target.value='';
}
</script>
