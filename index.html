function positionDropdown(btn,menu){
  const r=btn.getBoundingClientRect();
  menu.style.left='auto';
  menu.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  menu.style.top=(r.bottom+4)+'px';
  requestAnimationFrame(()=>{
    const mr=menu.getBoundingClientRect();
    if(mr.bottom>window.innerHeight-8) menu.style.top=Math.max(8,r.top-mr.height-4)+'px';
    if(mr.left<8){ menu.style.right='auto'; menu.style.left='8px'; }
  });
}
function toggleDropdown(e,id){
  e.stopPropagation();
  const menu=document.getElementById(id);
  document.querySelectorAll('.dropdown-menu').forEach(m=>{ if(m!==menu) m.classList.add('hidden'); });
  const willOpen=menu.classList.contains('hidden');
  menu.classList.toggle('hidden');
  if(willOpen) positionDropdown(e.currentTarget,menu);
}
/* Menu ⋯ générique en bout de ligne (tableaux/grilles) — pas d'id requis : le menu est le
   frère DOM du bouton déclencheur. position:fixed + positionDropdown() lui évite d'être
   rogné par les conteneurs de tableau en overflow-x:auto. */
function toggleRowMenu(e){
  e.stopPropagation();
  const btn=e.currentTarget;
  const menu=btn.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(m=>{ if(m!==menu) m.classList.add('hidden'); });
  const willOpen=menu.classList.contains('hidden');
  menu.classList.toggle('hidden');
  if(willOpen) positionDropdown(btn,menu);
}
document.addEventListener('click',()=>document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.add('hidden')));
async function dupliquerDevis(devisId){
  const {data:d}=await sb.from('devis').select('*').eq('id',devisId).single();
  const {data:lignes}=await sb.from('devis_lignes').select('*').eq('devis_id',devisId);
  const copy={...d}; delete copy.id; delete copy.code; delete copy.created_at;
  delete copy.racine_id; delete copy.version_number; delete copy.is_current;
  const {data:newDevis,error}=await sb.from('devis').insert(copy).select().single();
  if(error){ toast(error.message,'error'); return; }
  if(lignes?.length){
    const rows=lignes.map(l=>{ const c={...l}; delete c.id; c.devis_id=newDevis.id; return c; });

  }

async function reviserDevis(devisId){
  const {data:d,error:e1}=await sb.from('devis').select('*').eq('id',devisId).single();
  if(e1){ toast(e1.message,'error'); return; }
  const {data:lignes,error:e2}=await sb.from('devis_lignes').select('*').eq('devis_id',devisId).order('ordre');
  if(e2){ toast(e2.message,'error'); return; }
  const {data:racine}=await sb.from('devis').select('code').eq('id',d.racine_id).single();
  const {data:versions}=await sb.from('devis').select('version_number').eq('racine_id',d.racine_id);
  const nextVersion=Math.max(1,...(versions||[]).map(v=>v.version_number||1))+1;
  const baseCode=(racine?.code||d.code).replace(/-V\d+$/,'');
  const copy={...d};
  delete copy.id; delete copy.created_at;
  Object.assign(copy,{code:`${baseCode}-V${nextVersion}`,version_number:nextVersion,is_current:true,statut:'en_attente',date_creation:new Date().toISOString().slice(0,10),created_by:CURRENT_USER.id});
  const {data:newDevis,error}=await sb.from('devis').insert(copy).select().single();
  if(error){ toast(error.message,'error'); return; }
  if(lignes?.length){
    const rows=lignes.map(l=>{ const c={...l}; delete c.id; delete c.created_at; c.devis_id=newDevis.id; return c; });
    const {error:e3}=await sb.from('devis_lignes').insert(rows);
    if(e3){ toast(e3.message,'error'); return; }
  }
  await sb.from('devis').update({is_current:false}).eq('id',devisId);
  toast(`Révision ${newDevis.code} créée — statut réinitialisé à « En attente ».`);
  window._editId=newDevis.id; showPage('devis-view');
}

async function convertirEnFacture(devisId,type){
  type=type||'simple';
  const {data:d}=await sb.from('devis').select('*').eq('id',devisId).single();
  const label=type==='fne'?'Facture normalisée FNE':'Facture simple';
  if(!confirm(`Générer une ${label} pour le devis ${d.code} (${money(d.total)}) ?`)) return;
  const rec={devis_id:devisId,client_id:d.client_id,total:d.total,created_by:CURRENT_USER.id,type_facture:type};
  if(type==='fne'){
    const {data:client}=await sb.from('clients').select('ncc,rccm,regime_fiscal').eq('id',d.client_id).single();
    if(!client?.ncc && client?.regime_fiscal!=='particulier'){
      if(!confirm("Ce client n'a pas de NCC renseigné (requis par la DGI pour un client entreprise). Continuer avec une référence provisoire ?")) return;
    }
    const cert=await certifierFacturefne(d,client);
    rec.fne_reference=cert.reference; rec.fne_statut=cert.statut;
  }
  const {error}=await sb.from('factures').insert(rec);
  if(error){ toast(error.message,'error'); return; }
  await sb.from('devis').update({statut:'accepte'}).eq('id',devisId);
  toast(label+' générée'+(type==='fne'?' ('+rec.fne_statut+').':'.')); showPage('devis');
}
async function certifierFacturefne(devis,client){
  const p=window.APP_PARAMS||await loadAppParams();
  if(!p.fne_actif){ return {reference:'PROV-'+Date.now(),statut:'provisoire'}; }
  const url=p.fne_environnement==='production'?p.fne_url_prod:p.fne_url_test;
  if(!url||!p.fne_api_key) return {reference:'PROV-'+Date.now(),statut:'provisoire'};
  try{
    const res=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+p.fne_api_key,'Content-Type':'application/json'},body:JSON.stringify({pointVente:p.fne_point_vente,etablissement:p.fne_etablissement,montant:devis.total,client:{id:devis.client_id,ncc:client?.ncc||null,rccm:client?.rccm||null}})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json().catch(()=>({}));
    return {reference:json.reference||json.ncc||('FNE-'+Date.now()),statut:'certifiee'};
  }catch(err){
    return {reference:'PROV-'+Date.now(),statut:'provisoire'};
  }
}

let estimChart=null;
async function openEstimation(devisId){
  const {data:d}=await sb.from('devis').select('*, clients(nom,prenoms)').eq('id',devisId).single();
  const {data:lignes}=await sb.from('devis_lignes').select('*').eq('devis_id',devisId).order('ordre');
  const montantFacture=+d.total||0;
  const coutMateriel=(lignes||[]).reduce((s,l)=>s+(+l.total||0)*(+l.cout_materiel_pct||60)/100,0);
  const margeBrute=montantFacture-coutMateriel;
  const pctMat=montantFacture?coutMateriel/montantFacture*100:0;
  const pctMarge=montantFacture?margeBrute/montantFacture*100:0;
  window._estimCurrent={d,lignes,montantFacture,coutMateriel,margeBrute};
  openModal(`
    <div class="flex justify-between items-start mb-4"><div><h2 class="text-lg font-bold">Estimation financière de la commande</h2><p class="text-xs text-gray-400">Devis ${escapeHtml(d.code)}</p></div><button onclick="closeModal()" class="text-gray-400 text-xl leading-none">×</button></div>
    <div class="text-xs bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2 mb-4">⚠️ Attention ! Chiffres approximatifs — coût matériel estimé via le % défini par produit (catalogue), pas un chiffrage BOM détaillé.</div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
      <div class="card p-4"><div class="text-gray-400 text-xs">Code</div><div class="font-black mt-1">${escapeHtml(d.code)}</div></div>
      <div class="card p-4"><div class="text-gray-400 text-xs">Montant facturé</div><div class="font-black mt-1">${money(montantFacture)}</div></div>
      <div class="card p-4"><div class="text-gray-400 text-xs">Coût du matériel</div><div class="font-black mt-1 text-red-600">${money(coutMateriel)}</div></div>
      <div class="card p-4"><div class="text-gray-400 text-xs">Marge brute</div><div class="font-black mt-1 ${margeBrute<0?'text-red-600':'text-emerald-600'}">${money(margeBrute)}</div></div>
    </div>
    <div class="card p-4 mb-5">
      <h3 class="font-bold mb-3">Parité</h3>
      <canvas id="estimChartCanvas" height="90"></canvas>
      <div class="grid sm:grid-cols-3 gap-2 mt-4 text-sm">
        <div class="flex justify-between border-b pb-1"><span>Matériel</span><b class="text-red-600">${pctMat.toFixed(1)}%</b></div>
        <div class="flex justify-between border-b pb-1"><span>Marge brute</span><b class="${pctMarge<0?'text-red-600':'text-indigo-600'}">${pctMarge.toFixed(1)}%</b></div>
        <div class="flex justify-between border-b pb-1"><span>Facture</span><b class="text-amber-600">100%</b></div>
      </div>
    </div>
    <div class="overflow-x-auto mb-5"><table><thead><tr><th>Désignation</th><th>Pièce</th><th class="text-right">Qté</th><th class="text-right">Total</th><th class="text-right">Coût matériel</th></tr></thead>
    <tbody>${(lignes||[]).map(l=>`<tr><td>${escapeHtml(l.titre)}</td><td class="text-xs text-gray-500">${escapeHtml(l.piece)}</td><td class="text-right">${l.quantite}</td><td class="text-right">${money(l.total)}</td><td class="text-right">${money((+l.total||0)*(+l.cout_materiel_pct||60)/100)}</td></tr>`).join('')||'<tr><td colspan="5" class="text-gray-400 p-3">Aucune ligne.</td></tr>'}</tbody></table></div>
    <button class="btn btn-amber w-full py-3" onclick="printEstimation()">IMPRIMER FICHE DE PRÉVISUALISATION CHANTIER</button>`);
  const ctx=document.getElementById('estimChartCanvas').getContext('2d');
  if(estimChart) estimChart.destroy();
  let running=0;
  const cumul=(lignes||[]).map(l=>running+=(+l.total||0));
  estimChart=new Chart(ctx,{type:'line',data:{labels:(lignes||[]).map((l,i)=>'L'+(i+1)),datasets:[{label:'Montant cumulé',data:cumul.length?cumul:[0],borderColor:'#6d28d9',backgroundColor:'rgba(109,40,217,.08)',tension:.35,fill:true,pointRadius:2}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>(v/1000).toFixed(0)+'k'}}}}});
}

const PORTAIL_TEMPLATE = `<!DOCTYPE html>

function renderLogin(msg){

async function genererPortailClient(){
  const el=document.getElementById('portailResult');
  try{
    const brand=buildPortailBrand();
    const bjson=JSON.stringify(brand).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    let html=PORTAIL_TEMPLATE
      .split('__SB_URL__').join(window.SB_CFG.SUPABASE_URL)
      .split('__SB_KEY__').join(window.SB_CFG.SUPABASE_ANON_KEY)
      .split('__PORTAIL_BRAND__').join(bjson);
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='portail-client-beda-alu.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    if(el){ el.textContent='✅ Portail généré pour « '+(brand.nom)+' ». Déposez ce fichier sur votre hébergeur ou envoyez-le à vos clients.'; el.className='text-sm mt-3 text-emerald-600'; }
    toast('Portail client généré.');
  }catch(err){
    if(el){ el.textContent='❌ '+err.message; el.className='text-sm mt-3 text-red-600'; }
  }
}
async function fneTesterConnexion(){
  const el=document.getElementById('fneTestResult');
  el.textContent='Test en cours…'; el.className='text-sm mt-3 text-gray-500';
  const p=window.APP_PARAMS||{};
  const url=(val('fneEnvironnement')==='production'?val('fneUrlProd'):val('fneUrlTest'))||p.fne_url_test;
  const key=val('fneApiKey')||p.fne_api_key;
  if(!url||!key){ el.textContent='⚠️ Renseignez URL et clé API avant de tester.'; el.className='text-sm mt-3 text-amber-600'; return; }
  try{
    const res=await fetch(url,{method:'GET',headers:{'Authorization':'Bearer '+key}});
    el.textContent=`✅ Réponse reçue (HTTP ${res.status}).`; el.className='text-sm mt-3 text-emerald-600';
  }catch(err){
    el.textContent='❌ Appel navigateur bloqué (CORS/mixed-content) — normal en direct : prévoir un relais Supabase Edge Function pour la production.';
    el.className='text-sm mt-3 text-red-600';
  }
}
function switchParamTab(tab){
  document.querySelectorAll('.param-tab-btn').forEach(b=>{ const on=b.dataset.paramtab===tab; b.classList.toggle('bg-indigo-600',on); b.classList.toggle('text-white',on); });
  document.querySelectorAll('.param-tab').forEach(t=>t.classList.toggle('hidden',t.id!=='paramTab-'+tab));
  if(tab==='synchro') refreshSyncCounts();
}
function handleLogoUpload(e){
  const file=e.target.files[0]; if(!file) return;

  const {error}=await sb.from('parametres').update({logo_base64:null}).eq('id',window.APP_PARAMS.id);
  if(error){ toast(error.message,'error'); return; }

async function testerConnexionSupabase(){
  const el=document.getElementById('sbTestResult');
  el.textContent='Test en cours…'; el.className='text-sm mt-3 text-gray-500';
  const t0=performance.now();
  const {error}=await sb.from('parametres').select('id',{count:'exact',head:true});
  const ms=Math.round(performance.now()-t0);
  if(error){ el.textContent='❌ Échec : '+error.message; el.className='text-sm mt-3 text-red-600'; }
  else { el.textContent=`✅ Connexion OK (${ms} ms)`; el.className='text-sm mt-3 text-emerald-600'; }
}
async function refreshSyncCounts(){
  const el=document.getElementById('syncStatusPanel'); if(!el) return;
  const modules=[['Clients','clients'],['Prospects','prospects'],['Fournisseurs','fournisseurs'],['Projets','projets'],['Devis','devis'],['Factures','factures'],['Produits','produits'],["Fiches d'exécution",'fiches_execution']];
  const t0=performance.now();
  let online=true;
  const rows=await Promise.all(modules.map(async([label,table])=>{
    const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});
    if(error) online=false;
    return {label,count:error?'—':count};
  }));
  const ms=Math.round(performance.now()-t0);
  el.innerHTML=`
    <div class="mb-3">${online?`<span class="text-emerald-600 font-semibold">🟢 En ligne</span> — vérifié en ${ms} ms`:'<span class="text-red-600 font-semibold">🔴 Connexion perturbée</span>'}</div>
    <table><thead><tr><th>Module</th><th class="text-right">Enregistrements</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.label)}</td><td class="text-right font-semibold">${r.count}</td></tr>`).join('')}</tbody></table>
    <div class="text-xs text-gray-400 mt-2">Dernière vérification : ${new Date().toLocaleTimeString('fr-FR')}</div>`;
}
async function exporterSauvegarde(){
  const resEl=document.getElementById('backupResult');
  resEl.textContent='Export en cours…'; resEl.className='text-sm mt-3 text-gray-500';
  try{
    const backup={exported_at:new Date().toISOString(),tables:{}};
    for(const table of BACKUP_TABLES){
      const {data,error}=await sb.from(table).select('*');
      if(error) throw error;
      backup.tables[table]=data;
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`beda-alu-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    await sb.from('parametres').update({derniere_sauvegarde:new Date().toISOString()}).eq('id',window.APP_PARAMS.id);
    await loadAppParams();
    document.getElementById('lastBackupLabel').textContent=fmtDate(window.APP_PARAMS.derniere_sauvegarde);
    resEl.textContent='✅ Export terminé.'; resEl.className='text-sm mt-3 text-emerald-600';
  }catch(err){ resEl.textContent='❌ '+(err.message||err); resEl.className='text-sm mt-3 text-red-600'; }
}
async function importerSauvegarde(e){
  const file=e.target.files[0]; if(!file) return;
  if(!confirm("Importer ce fichier ? Les enregistrements existants portant le même identifiant seront écrasés.")) { e.target.value=''; return; }
  const resEl=document.getElementById('backupResult');
  resEl.textContent='Import en cours…'; resEl.className='text-sm mt-3 text-gray-500';
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    for(const table of BACKUP_TABLES){
      const rows=backup.tables?.[table];
      if(!rows || !rows.length) continue;
      const {error}=await sb.from(table).upsert(rows,{onConflict:'id'});
      if(error) throw new Error(table+' : '+error.message);
    }
    resEl.textContent='✅ Import terminé.'; resEl.className='text-sm mt-3 text-emerald-600';
  }catch(err){ resEl.textContent='❌ '+(err.message||err); resEl.className='text-sm mt-3 text-red-600'; }
  e.target.value='';
}
</script>
