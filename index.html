<style>
  :root{ --navy:#111a2e; --navy-2:#0c1424; --accent:#6d28d9; --accent-2:#5b21b6; }
  *{box-sizing:border-box}
  body{background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .hidden{display:none!important}
  .nav-item{color:#cbd5e1;transition:background .12s;display:flex;align-items:center;gap:8px}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:var(--accent);color:#fff}
  .sidebar-group-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:800;padding:16px 12px 4px}
  .nav-parent{width:100%;text-align:left;color:#cbd5e1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;transition:background .12s}
  .nav-parent:hover{background:rgba(255,255,255,.08);color:#fff}

  .nav-parent.open .chev{transform:rotate(90deg)}
  .sidebar-children{max-height:0;overflow:hidden;transition:max-height .18s ease}

  .nav-child{width:100%;text-align:left;color:#94a3b8;display:block;padding:8px 12px 8px 30px;font-size:12.5px;border-radius:8px}
  .nav-child:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-child.active{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
  .nav-child{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;font-size:10px;font-weight:800;color:#fff}
  .nav-badge-gray{background:#64748b}
  .nav-badge-blue{background:#2563eb}
  .nav-badge-amber{background:#d97706}
  .nav-badge-red{background:#dc2626}
  .nav-badge-purple{background:#7c3aed}
  .nav-badge-green{background:#059669}
  .btn{padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:0;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-2)}
  .btn-green{background:#059669;color:#fff}.btn-green:hover{background:#047857}
  .btn-pink{background:#db2777;color:#fff}.btn-pink:hover{background:#be185d}
  .btn-dark{background:#111a2e;color:#fff}.btn-dark:hover{background:#0c1424}
  .btn-outline{background:#fff;border:1px solid #d1d5db;color:#374151}.btn-outline:hover{background:#f9fafb}
  .btn-amber{background:#f59e0b;color:#fff}.btn-amber:hover{background:#d97706}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px}
  .page-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;border-top:4px solid var(--accent);padding:24px}
  .page-card h2{font-size:16px;font-weight:800;color:#3b2170;display:flex;align-items:center;gap:8px}
  .page-card .divider{border-top:1px solid #e5e7eb;margin:14px 0 20px}
  .field label{font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:4px}
  .field-input{display:flex;align-items:center;gap:8px;border:1px solid #d1d5db;border-radius:8px;padding:0 10px;background:#fff}
  .field-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.12)}
  .field-input .fi{color:#9ca3af;font-size:14px;flex-shrink:0}
  .field-input input,.field-input select{border:0!important;padding:9px 0!important;box-shadow:none!important}
  .smart-select{position:relative;flex:1;min-width:0}
  .smart-select-input{width:100%}
  .smart-select-list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 12px 32px -8px rgba(17,24,39,.2);max-height:240px;overflow-y:auto;z-index:70;padding:4px}

  .smart-select-opt{padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:#374151}
  .smart-select-opt:hover,.smart-select-opt.active{background:#f3e8ff;color:var(--accent)}
  .smart-select-empty{padding:10px;font-size:12px;color:#9ca3af;text-align:center}
  .kanban-col{min-width:260px;max-width:260px;background:#f8fafc;border-radius:12px;border:1px solid #e5e7eb;display:flex;flex-direction:column;max-height:calc(100vh - 230px);transition:background .15s,border-color .15s}

  .kanban-col-body{padding:8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}

  .kanban-card:hover{box-shadow:0 4px 14px -4px rgba(0,0,0,.18);transform:translateY(-1px)}
  .kanban-card:active{cursor:grabbing}
  input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.12)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left}
  thead th{background:#f9fafb;font-size:11px;text-transform:uppercase;color:#6b7280;letter-spacing:.03em;border-bottom:1px solid #e5e7eb}
  tbody tr{border-bottom:1px solid #f1f5f9}
  tbody tr:hover{background:#fafafa}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-box{background:#fff;border-radius:16px;padding:24px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto}
  .icon-btn{position:relative;width:36px;height:36px;border-radius:999px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:15px;color:#4b5563;border:0;cursor:pointer}
  .icon-btn:hover{background:#e5e7eb}
  .icon-btn .dot{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .avatar{width:34px;height:34px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .doc-header{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .doc-client-name{font-size:20px;font-weight:800;text-transform:uppercase}
  .doc-header p{margin:2px 0;font-size:13px;color:#374151}
  .doc-header a{color:var(--accent)}
  .doc-code{text-align:right}
  .doc-code .code-txt{font-size:22px;font-weight:800;color:var(--accent)}
  .doc-num{background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-weight:800;font-size:12px}
  .doc-table{width:100%;border-collapse:collapse;font-size:13px}
  .doc-table th{background:transparent;border-bottom:2px solid #111827;font-size:11px;text-transform:uppercase;color:#6b7280;padding:6px 8px;text-align:left}
  .doc-table td{padding:8px;border-bottom:1px solid #f1f5f9}
  .doc-table .tc{text-align:center}.doc-table .tr{text-align:right}
  .doc-mt{font-weight:800;color:var(--accent)}
  .doc-totals{max-width:340px;margin-left:auto}
  .doc-totals div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e5e7eb;font-size:13px}
  .doc-totals span{color:#6b7280;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.02em}
  .doc-total-final{font-weight:800!important;color:var(--accent);border-top:2px solid #111827!important;border-bottom:0!important}
  .doc-total-final span{color:var(--accent)!important}
  .pill{display:inline-flex;align-items:center;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor}
  .dropdown{position:relative;display:inline-block}
  .dropdown-menu{position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);min-width:190px;z-index:200;overflow:hidden}
  .dropdown-menu button{width:100%;text-align:left;padding:9px 14px;font-size:13px;background:#fff;border:0;cursor:pointer;color:#374151;display:flex;align-items:center;gap:6px}
  .dropdown-menu button:hover{background:#f3f4f6}
  .btn-icon-menu{width:30px;height:30px;border-radius:8px;border:1px solid #ddd6fe;background:#f5f3ff;color:var(--accent);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .btn-icon-menu:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fam-section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .fam-section-head .bar{width:5px;height:20px;border-radius:3px}
  .fam-section-head h3{font-size:13px;font-weight:800;color:#111827;text-transform:none;letter-spacing:0}
  .fam-section-head .count{background:#f3f4f6;color:#6b7280;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .fam-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid #e5e7eb;color:#4b5563;cursor:pointer;white-space:nowrap;transition:transform .1s,box-shadow .15s,border-color .15s}
  .fam-chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px -4px rgba(0,0,0,.15)}
  .fam-chip.active{background:var(--fc,var(--accent));border-color:var(--fc,var(--accent));color:#fff}
  .fam-row-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
  .fam-row-scroll .produit-card{flex:0 0 230px;scroll-snap-align:start}
  .produit-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;cursor:default}
  .produit-card::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--fc,var(--accent))}
  .produit-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -10px rgba(17,24,39,.18);border-color:var(--fc,var(--accent))}
  .produit-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#f3f4f6;background:color-mix(in srgb, var(--fc,var(--accent)) 14%, white);box-shadow:inset 0 0 0 1px #e5e7eb;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--fc,var(--accent)) 25%, white)}
  .produit-pct{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:#f3f4f6;background:color-mix(in srgb, var(--fc,var(--accent)) 14%, white);color:var(--fc,var(--accent))}
  .produit-card .pname{font-weight:700;margin-top:12px;font-size:14px;color:#111827;line-height:1.3}
  .produit-card .punite{font-size:11px;color:#9ca3af;margin-top:2px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .produit-card .pactions{display:flex;justify-content:flex-end;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
  .produit-card:hover .pactions{opacity:1;transform:translateY(0)}
  .produit-card .pactions button{font-size:11.5px;font-weight:700}
  .view-toggle-btn{background:#fff;color:#6b7280;transition:background .15s,color .15s}
  .view-toggle-btn.active{background:var(--accent);color:#fff}
  .entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  @media (max-width:900px){#sidebar{position:fixed;inset:0 20% 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;max-width:260px}#sidebar.open{transform:translateX(0)}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;pointer-events:none}#overlay.open{opacity:1;pointer-events:auto}}
</style>
</head>

<!-- ===== AUTH SCREEN ===== -->
<div id="authScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-2xl font-black">BEDA<span style="color:var(--accent)">ALU</span></div>
      <p class="text-sm text-gray-500 mt-1">Gestion menuiserie aluminium</p>
    </div>
    <div class="card p-6">
      <div id="authMsg" class="hidden text-sm rounded-lg px-3 py-2 mb-3"></div>
      <form id="loginForm" class="space-y-3">
        <input id="authEmail" type="email" required placeholder="Email" autocomplete="username">
        <input id="authPassword" type="password" required placeholder="Mot de passe" autocomplete="current-password">
        <button type="submit" class="btn btn-primary w-full py-2.5">Se connecter</button>
      </form>
      <button id="toggleSignup" class="text-xs text-gray-400 hover:text-gray-600 w-full text-center mt-4">Première connexion ? Créer un compte administrateur</button>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->

<script>
/* ============================== CORE / UTILS ============================== */
const { createClient } = supabase;
const sb = createClient(window.SB_CFG.SUPABASE_URL, window.SB_CFG.SUPABASE_ANON_KEY);
let CURRENT_USER = null;
function money(n){ return new Intl.NumberFormat('fr-FR').format(Math.round(n||0)) + ' FCFA'; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function toast(msg, kind){
  const el=document.createElement('div');
  el.className='fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-lg text-sm font-semibold shadow-lg '+(kind==='error'?'bg-red-600 text-white':'bg-gray-900 text-white');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`; }

const STATUT_DEVIS = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},en_cours:{label:'En cours',color:'bg-amber-50 text-amber-700'},accepte:{label:'Accepté',color:'bg-emerald-50 text-emerald-700'},refuse:{label:'Refusé',color:'bg-red-50 text-red-700'},annule:{label:'Annulé',color:'bg-gray-100 text-gray-500'}};
const STATUT_FACTURE = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},payee_partielle:{label:'Payée partielle',color:'bg-amber-50 text-amber-700'},payee:{label:'Payée',color:'bg-emerald-50 text-emerald-700'},annulee:{label:'Annulée',color:'bg-gray-100 text-gray-500'}};
const STATUT_FICHE = {en_attente:{label:'En attente',color:'bg-blue-50 text-blue-700'},en_cours:{label:'En cours',color:'bg-amber-50 text-amber-700'},termine:{label:'Terminé',color:'bg-emerald-50 text-emerald-700'}};
function badge(map,key){ const m=map[key]||{label:key,color:'bg-gray-100 text-gray-500'}; return `<span class="badge ${m.color}">${escapeHtml(m.label)}</span>`; }

/* ============================== AUTH ============================== */
let authMode='login';
document.getElementById('toggleSignup').onclick=()=>{
  authMode = authMode==='login' ? 'signup' : 'login';
  document.getElementById('toggleSignup').textContent = authMode==='login' ? 'Première connexion ? Créer un compte administrateur' : '← Retour à la connexion';
  document.querySelector('#loginForm button[type=submit]').textContent = authMode==='login' ? 'Se connecter' : 'Créer le compte';
};
function showAuthMsg(msg,isError){
  const el=document.getElementById('authMsg');
  el.textContent=msg; el.classList.remove('hidden');
  el.className='text-sm rounded-lg px-3 py-2 mb-3 '+(isError?'bg-red-50 text-red-700':'bg-blue-50 text-blue-700');
}
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    if(authMode==='signup'){
      const {error}=await sb.auth.signUp({email,password});
      if(error) throw error;
      showAuthMsg('Compte créé. Connectez-vous.', false);
      authMode='login'; document.getElementById('toggleSignup').click(); document.getElementById('toggleSignup').click();
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      await enterApp();
    }
  }catch(err){ showAuthMsg(err.message||'Erreur', true); }
  finally{ btn.disabled=false; }
});
async function handleLogout(){ await sb.auth.signOut(); CURRENT_USER=null; document.getElementById('appScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); }
async function enterApp(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return;
  CURRENT_USER=user;
  const {data:profile}=await sb.from('profiles').select('nom_complet').eq('id',user.id).maybeSingle();
  const displayName=profile?.nom_complet||user.email;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('sbUserEmail').textContent=user.email;
  document.getElementById('hdrUserName').textContent=displayName;
  document.getElementById('hdrAvatar').textContent=displayName.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const {count:nbAttente}=await sb.from('devis').select('*',{count:'exact',head:true}).eq('statut','en_attente').eq('is_current',true);
  const bell=document.getElementById('hdrBellCount');
  if(nbAttente){ bell.textContent=nbAttente; bell.classList.remove('hidden'); }
  refreshDevisBadges();
  refreshProjetsBadges();
  refreshStockAlertesBadge();
  loadAppParams();
  showPage('dashboard');
}
(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await enterApp();
})();

/* ============================== ROUTING ============================== */
const PAGE_TITLES={dashboard:'Accueil',carte:'Carte — Clients, Chantiers, Prospects & Commerciaux','carte-chantiers':'Carte des chantiers',clients:'Clients','clients-add':'Ajouter un client','clients-categories':'Catégorie clients',prospects:'Prospects','prospects-add':'Ajouter un prospect',fournisseurs:'Fournisseurs','fournisseurs-add':'Ajouter un fournisseur',projets:'Projets — Tout afficher','projets-add':'Ajouter un projet','projets-attente':'Projet en attente','projets-mesure':'Mesure disponible','projets-pret':'Prêt pour fabrication','projets-fabrication':'Fabrication en cours','projets-installation':'Installation en cours','projets-termine':'Projet terminé','projets-retard':'Projet en retard','projets-annule':'Projet Annulé',devis:'Devis — Tout afficher','devis-add':'Ajouter un Devis','devis-pipeline':'Pipeline commercial','devis-view':'Devis','devis-attente':'Devis en attente','devis-cours':'Devis en cours','devis-annules':'Devis annulés','devis-categories':'Catégorie de devis',factures:'Factures','facture-view':'Facture',fiches:"Fiches d'exécution",produits:'Produits','produits-add':'Ajouter un produit','produits-config':"Configurateur d'ouvrage",composants:'Composants & consommables','composants-add':'Ajouter un composant','stock-dashboard':'Stock — Tableau de bord','stock-mouvements':'Stock — Mouvements','stock-alertes':'Stock — Alertes','stock-inventaire':'Stock — Inventaire','stock-simulateur':'Stock — Simulateur multi-chantiers',parametres:'Paramètres'};
const PAGE_RENDERERS={dashboard:renderDashboard,carte:renderCarte,'carte-chantiers':renderCarteChantiers,clients:renderClients,'clients-add':renderClientForm,'clients-categories':renderClientCategories,prospects:renderProspects,'prospects-add':renderProspectForm,fournisseurs:renderFournisseurs,'fournisseurs-add':renderFournisseurForm,projets:(el)=>renderProjets(el,null),'projets-add':renderProjetForm,'projets-attente':(el)=>renderProjets(el,'en_attente'),'projets-mesure':(el)=>renderProjets(el,'mesure_disponible'),'projets-pret':(el)=>renderProjets(el,'pret_fabrication'),'projets-fabrication':(el)=>renderProjets(el,'fabrication_en_cours'),'projets-installation':(el)=>renderProjets(el,'installation_en_cours'),'projets-termine':(el)=>renderProjets(el,'termine'),'projets-retard':(el)=>renderProjets(el,'retard'),'projets-annule':(el)=>renderProjets(el,'annule'),devis:(el)=>renderDevis(el,null),'devis-add':renderDevisEditorPage,'devis-pipeline':renderDevisPipeline,'devis-view':renderDevisDetail,'devis-attente':(el)=>renderDevis(el,'en_attente'),'devis-cours':(el)=>renderDevis(el,'en_cours'),'devis-annules':(el)=>renderDevis(el,'annule'),'devis-categories':renderDevisCategories,factures:renderFactures,'facture-view':renderFactureDetail,fiches:renderFiches,produits:renderProduits,'produits-add':renderProduitForm,'produits-config':renderConfigurateur,composants:renderComposants,'composants-add':renderComposantForm,'stock-dashboard':renderStockDashboard,'stock-mouvements':renderStockMouvements,'stock-alertes':renderStockAlertes,'stock-inventaire':renderStockInventaire,'stock-simulateur':renderStockSimulateur,parametres:renderParametres};
const PAGE_TO_GROUP={'clients-add':'clients-g',clients:'clients-g','clients-categories':'clients-g','prospects-add':'prospects-g',prospects:'prospects-g','fournisseurs-add':'fournisseurs-g',fournisseurs:'fournisseurs-g','projets-add':'projets-g',projets:'projets-g','projets-attente':'projets-g','projets-mesure':'projets-g','projets-pret':'projets-g','projets-fabrication':'projets-g','projets-installation':'projets-g','projets-termine':'projets-g','projets-retard':'projets-g','projets-annule':'projets-g','carte-chantiers':'projets-g','devis-add':'devis-g','devis-pipeline':'devis-g',devis:'devis-g','devis-view':'devis-g','devis-attente':'devis-g','devis-cours':'devis-g','devis-annules':'devis-g','devis-categories':'devis-g',factures:'factures-g','facture-view':'factures-g',fiches:'fiches-g','produits-add':'produits-g','produits-config':'produits-g',produits:'produits-g','composants-add':'composants-g',composants:'composants-g','stock-dashboard':'stock-g','stock-mouvements':'stock-g','stock-alertes':'stock-g','stock-inventaire':'stock-g','stock-simulateur':'stock-g'};
window._editId=null;
async function showPage(page){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.nav-child').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const groupKey=PAGE_TO_GROUP[page];
  document.querySelectorAll('.nav-parent').forEach(b=>{
    const isMatch=b.dataset.toggle===groupKey;
    if(isMatch){ b.classList.add('open'); document.querySelector(`.sidebar-children[data-children="${groupKey}"]`).classList.add('open'); }
  });
  document.getElementById('pageTitle').textContent=PAGE_TITLES[page]||'';
  const el=document.getElementById('pageContent');
  el.innerHTML='<div class="text-sm text-gray-400 p-8 text-center">Chargement…</div>';
  closeSidebar();
  try{ await PAGE_RENDERERS[page](el); }
  catch(err){ el.innerHTML=`<div class="text-sm text-red-600">${escapeHtml(err.message||String(err))}</div>`; }
}
document.querySelectorAll('.nav-item[data-page], .nav-child[data-page]').forEach(b=>b.onclick=()=>{ if(!b.classList.contains('nav-child')) window._editId=null; showPage(b.dataset.page); });
document.querySelectorAll('.nav-parent[data-toggle]').forEach(b=>{
  b.onclick=()=>{
    const key=b.dataset.toggle;
    const kids=document.querySelector(`.sidebar-children[data-children="${key}"]`);
    const willOpen=!kids.classList.contains('open');
    document.querySelectorAll('.sidebar-children').forEach(c=>c.classList.remove('open'));
    document.querySelectorAll('.nav-parent').forEach(p=>p.classList.remove('open'));
    if(willOpen){ kids.classList.add('open'); b.classList.add('open'); }
  };
});

/* ============================== DASHBOARD ============================== */
async function renderDashboard(el){
  const [{count:nbClients},{count:nbDevisEnCours},{count:nbChantiers},facturesRes]=await Promise.all([
    sb.from('clients').select('*',{count:'exact',head:true}),
    sb.from('devis').select('*',{count:'exact',head:true}).in('statut',['en_attente','en_cours']).eq('is_current',true),
    sb.from('projets').select('*',{count:'exact',head:true}),
    sb.from('factures').select('total,statut').neq('statut','payee')
  ]);
  const enAttente=(facturesRes.data||[]).reduce((s,f)=>s+(+f.total||0),0);
  el.innerHTML=`
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="card p-5"><div class="text-gray-400 text-xs">Clients</div><div class="text-2xl font-black mt-2">${nbClients||0}</div></div>
      <div class="card p-5"><div class="text-gray-400 text-xs">Devis en cours</div><div class="text-2xl font-black mt-2">${nbDevisEnCours||0}</div></div>
      <div class="card p-5"><div class="text-gray-400 text-xs">Projets / chantiers</div><div class="text-2xl font-black mt-2">${nbChantiers||0}</div></div>
      <div class="card p-5"><div class="text-gray-400 text-xs">Factures impayées</div><div class="text-2xl font-black mt-2 text-red-600">${money(enAttente)}</div></div>
    </div>
    <div class="card p-6">
      <h2 class="font-bold mb-1">Bienvenue, ${escapeHtml(CURRENT_USER?.email||'')} 👋</h2>
      <p class="text-sm text-gray-500">Créez un client, un devis, puis générez la fiche d'exécution et l'estimation financière depuis la fiche du devis.</p>
    </div>`;
}

/* ============================== CLIENTS ============================== */
async function renderClients(el){
  const [{data,error},{data:cats}]=await Promise.all([
    sb.from('clients').select('*').order('created_at',{ascending:false}),
    sb.from('client_categories').select('nom').order('nom')
  ]);
  if(error) throw error;
  window._clientsListCache=data;
  const catOptions=(cats||[]).map(c=>`<option value="${escapeHtml(c.nom)}">${escapeHtml(c.nom)}</option>`).join('');
  el.innerHTML=`
    <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
      <div class="text-sm text-gray-500" id="clientsCount">${data.length} client(s)</div>
      <button class="btn btn-primary" onclick="window._editId=null;showPage('clients-add')">+ Ajouter un client</button>
    </div>
    <div class="card mb-3">
      <div class="grid sm:grid-cols-4 gap-3 mb-3">
        <div class="sm:col-span-2">${fieldWrap('🔎',`<input id="clFilterQ" placeholder="Rechercher : nom, entreprise, téléphone, email…" oninput="filterClientsTable()">`)}</div>
        ${fieldWrap('🏷️',`<select id="clFilterCat" onchange="filterClientsTable()"><option value="">Toutes catégories</option>${catOptions}</select>`)}
        ${fieldWrap('🏙️',`<input id="clFilterVille" placeholder="Ville / commune" oninput="filterClientsTable()">`)}
      </div>
      ${listViewToggleHtml('clients','filterClientsTable')}
    </div>
    <div id="clientsList"></div>`;
  filterClientsTable();
}
function filterClientsTable(){
  const data=window._clientsListCache||[];
  const q=(document.getElementById('clFilterQ')?.value||'').trim().toLowerCase();
  const cat=document.getElementById('clFilterCat')?.value||'';
  const ville=(document.getElementById('clFilterVille')?.value||'').trim().toLowerCase();
  const filtered=data.filter(c=>{
    if(cat && c.categorie!==cat) return false;
    if(ville && !(c.commune||'').toLowerCase().includes(ville)) return false;
    if(q){
      const hay=[c.code,c.nom,c.prenoms,c.entreprise,c.telephone,c.email].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const host=document.getElementById('clientsList'); if(!host) return;
  const actionsHtml=c=>`<div class="dropdown">
      <button class="btn-icon-menu" onclick="toggleRowMenu(event)">⚙</button>
      <div class="dropdown-menu hidden">
        <button style="color:#6b7280" onclick="printClientFiche('${c.id}')">🖨 Imprimer la fiche</button>
        <button style="color:#4f46e5" onclick="window._editId='${c.id}';showPage('clients-add')">✏️ Modifier</button>
        <button style="color:#dc2626" onclick="deleteRow('clients','${c.id}','clients')">🗑️ Supprimer</button>
      </div>
    </div>`;
  if(getListView('clients')==='grille'){
    host.innerHTML=filtered.length?`<div class="entity-grid">${filtered.map(c=>entityCardHtml({
      icon:'👤',title:escapeHtml([c.civilite,c.nom,c.prenoms].filter(Boolean).join(' ')),
      subtitle:escapeHtml(c.entreprise||c.code),
      lines:[escapeHtml(c.telephone||'—'),escapeHtml(c.email||'—'),escapeHtml(c.commune||'—'),c.categorie?`<span class="badge bg-gray-100 text-gray-600">${escapeHtml(c.categorie)}</span>`:''],
      actionsHtml:actionsHtml(c)
    })).join('')}</div>`:'<div class="card text-center text-gray-400 p-8">Aucun client.</div>';
  } else {
    host.innerHTML=`<div class="card overflow-x-auto">
      <table><thead><tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Email</th><th>Ville</th><th>Catégorie</th><th></th></tr></thead>
      <tbody>${filtered.map(c=>`<tr>
        <td class="font-semibold">${escapeHtml(c.code)}</td>
        <td>${escapeHtml([c.civilite,c.nom,c.prenoms].filter(Boolean).join(' '))}${c.entreprise?`<div class="text-xs text-gray-400">${escapeHtml(c.entreprise)}</div>`:''}</td>
        <td>${escapeHtml(c.telephone||'—')}</td><td>${escapeHtml(c.email||'—')}</td><td>${escapeHtml(c.commune||'—')}</td>
        <td>${escapeHtml(c.categorie||'—')}</td>
        <td class="text-right whitespace-nowrap">${actionsHtml(c)}</td>
      </tr>`).join('')||'<tr><td colspan="7" class="text-gray-400 p-4">Aucun client.</td></tr>'}</tbody></table>
    </div>`;
  }
  const countEl=document.getElementById('clientsCount'); if(countEl) countEl.textContent=`${filtered.length} client(s)`+(filtered.length!==data.length?` sur ${data.length}`:'');
}
async function printClientFiche(id){
  const {data:c,error}=await sb.from('clients').select('*').eq('id',id).single();
  if(error){ toast(error.message,'error'); return; }
  const win=window.open('','_blank','width=800,height=1000'); if(!win) return;
  const nomComplet=[c.civilite,c.nom,c.prenoms].filter(Boolean).join(' ');
  const rows=[
    ['Code',c.code],['Nom',nomComplet],['Entreprise',c.entreprise],
    ['Téléphone',c.telephone],['Email',c.email],['Catégorie',c.categorie],
    ['Pays',c.pays],['Commune / Ville',c.commune],['Adresse',c.adresse],
    ['Source',c.source],['Commercial',c.commercial],
    ['NCC',c.ncc],['RCCM',c.rccm],['Régime fiscal',c.regime_fiscal],
    ['Créé le',fmtDate(c.created_at)]
  ].filter(([,v])=>v);
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Fiche client ${escapeHtml(c.code)}</title>
    <style>
      *{box-sizing:border-box}body{font-family:Arial,sans-serif;padding:34px;color:#111827;font-size:13px}
      h1{font-size:19px;margin:0 0 2px}
      table{width:100%;border-collapse:collapse;margin-top:10px}
      td{padding:8px 6px;border-bottom:1px solid #e5e7eb}
      td:first-child{font-weight:700;color:#6b7280;width:180px}
      @media print{ body{padding:0} }
    </style></head><body>
    ${printCompanyHeaderHtml()}
    <h1>FICHE CLIENT — ${escapeHtml(nomComplet||c.entreprise||'—')}</h1>
    <div style="color:#6b7280;font-size:12px">Code ${escapeHtml(c.code)}</div>
    <table>${rows.map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(String(v))}</td></tr>`).join('')}</table>
    ${printFooterQrHtml('FICHE CLIENT',c.code,0)}
    <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script>
    </body></html>`);
  win.document.close(); win.focus();
}
function fieldWrap(icon,inputHtml){ return `<div class="field-input"><span class="fi">${icon}</span>${inputHtml}</div>`; }
/* ---------- Bascule Grille/Liste générique, réutilisée par toutes les listes ---------- */
window._listViews=window._listViews||{};
function getListView(key){ return window._listViews[key]||'liste'; }
function setListView(key,v,rerenderFn){
  window._listViews[key]=v;
  document.getElementById(key+'ViewGrille')?.classList.toggle('active',v==='grille');
  document.getElementById(key+'ViewListe')?.classList.toggle('active',v==='liste');
  rerenderFn();
}
function listViewToggleHtml(key,rerenderFnName){
  const v=getListView(key);
  return `<div class="flex rounded-lg border overflow-hidden shrink-0">
    <button id="${key}ViewGrille" class="view-toggle-btn px-3 py-2 text-sm font-semibold${v==='grille'?' active':''}" onclick="setListView('${key}','grille',${rerenderFnName})">▦ Grille</button>
    <button id="${key}ViewListe" class="view-toggle-btn px-3 py-2 text-sm font-semibold border-l${v==='liste'?' active':''}" onclick="setListView('${key}','liste',${rerenderFnName})">☰ Liste</button>
  </div>`;
}
/* Carte générique pour les vues Grille des listes simples (Clients, Prospects, Fournisseurs,
   Projets, Devis, Factures, Fiches) — même habillage visuel que les catalogues Produits/
   Composants (.produit-card), sans regroupement par famille. */
function entityCardHtml({color,icon,badge,title,subtitle,lines,actionsHtml}){
  return `<div class="produit-card" style="--fc:${color||'#6d28d9'}">
    <div class="flex justify-between items-start">

window._smartSelectData=window._smartSelectData||{};
function smartSelect(id,items,selectedId,opts={}){
  window._smartSelectData[id]=items||[];
  const sel=(items||[]).find(it=>String(it.id)===String(selectedId||''));
  const label=sel?sel.label:'';
  const changeAttr=opts.onChange?` onchange="${opts.onChange}"`:'';
  return `<div class="smart-select">
    <input type="text" id="${id}_q" class="smart-select-input" autocomplete="off" placeholder="${escapeHtml(opts.placeholder||'Rechercher…')}" value="${escapeHtml(label)}" oninput="smartSelectFilter('${id}')" onfocus="smartSelectOpen('${id}')" onblur="smartSelectBlur('${id}')" onkeydown="smartSelectKey(event,'${id}')">
    <input type="hidden" id="${id}" value="${selectedId||''}"${changeAttr}>
    <div class="smart-select-list hidden" id="${id}_list"></div>
  </div>`;
}
function smartSelectRenderList(id,q){
  const items=window._smartSelectData[id]||[];
  const query=(q||'').trim().toLowerCase();
  const filtered=query?items.filter(it=>it.label.toLowerCase().includes(query)):items;
  const list=document.getElementById(id+'_list'); if(!list) return;
  list.innerHTML=filtered.length?filtered.slice(0,60).map((it,i)=>`<div class="smart-select-opt${i===0?' active':''}" data-val="${escapeHtml(String(it.id))}" onmousedown="smartSelectPick('${id}','${String(it.id).replace(/'/g,"\\'")}')">${escapeHtml(it.label)}</div>`).join(''):'<div class="smart-select-empty">Aucun résultat</div>';
  list.classList.remove('hidden');
}
function smartSelectOpen(id){ smartSelectRenderList(id,document.getElementById(id+'_q').value); }
function smartSelectFilter(id){ document.getElementById(id).value=''; smartSelectRenderList(id,document.getElementById(id+'_q').value); }
function smartSelectBlur(id){
  setTimeout(()=>{
    const list=document.getElementById(id+'_list'); if(list) list.classList.add('hidden');
    const hidden=document.getElementById(id),q=document.getElementById(id+'_q');
    if(!hidden||!q) return;
    if(hidden.value){ const items=window._smartSelectData[id]||[]; const sel=items.find(it=>String(it.id)===hidden.value); q.value=sel?sel.label:''; }
    else{ q.value=''; }
  },180);
}
function smartSelectPick(id,valId){
  const items=window._smartSelectData[id]||[];
  const it=items.find(x=>String(x.id)===String(valId));
  const hidden=document.getElementById(id),q=document.getElementById(id+'_q');
  hidden.value=valId; q.value=it?it.label:'';
  const list=document.getElementById(id+'_list'); if(list) list.classList.add('hidden');
  hidden.dispatchEvent(new Event('change'));
}
function smartSelectKey(e,id){
  const list=document.getElementById(id+'_list'); if(!list||list.classList.contains('hidden')) return;
  const opts=[...list.querySelectorAll('.smart-select-opt')]; if(!opts.length) return;
  let idx=opts.findIndex(o=>o.classList.contains('active'));
  if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1,opts.length-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1,0); }
  else if(e.key==='Enter'){ e.preventDefault(); if(idx>=0){ const valId=opts[idx].dataset.val; smartSelectPick(id,valId); } return; }
  else return;
  opts.forEach(o=>o.classList.remove('active')); opts[idx].classList.add('active'); opts[idx].scrollIntoView({block:'nearest'});
}

function geolocateField(latId,lngId){

    err=>toast("Impossible d'obtenir la position : "+err.message,'error'),
    {enableHighAccuracy:true,timeout:10000}
  );
}
function partagerMaPosition(){
  if(!navigator.geolocation){ toast('Géolocalisation non disponible sur cet appareil.','error'); return; }

    async pos=>{

  );
}

let _carteMap=null;
async function renderCarte(el){
  el.innerHTML=`

function refreshCarteLayers(){

  window._carteClientLayer.clearLayers(); window._carteProjetLayer.clearLayers();
  window._carteProspectLayer.clearLayers(); window._carteCommercialLayer.clearLayers();
  const clientIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 0 0 1px #2563eb"></div>',iconSize:[14,14]});
  const chantierIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#f59e0b;border:2px solid #fff;box-shadow:0 0 0 1px #f59e0b"></div>',iconSize:[14,14]});
  const prospectIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#7c3aed;border:2px solid #fff;box-shadow:0 0 0 1px #7c3aed"></div>',iconSize:[14,14]});
  const commercialIcon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#059669;border:2px solid #fff;box-shadow:0 0 0 1px #059669;display:flex;align-items:center;justify-content:center;font-size:9px">👤</div>',iconSize:[16,16]});
  const bounds=[];
  (window._carteClients||[]).forEach(c=>{

    bounds.push([c.latitude,c.longitude]);
  });
  (window._carteProjets||[]).forEach(p=>{
    const st=STATUT_PROJET[p.etape]||{label:p.etape};
    const clientNom=p.clients?[p.clients.nom,p.clients.prenoms].filter(Boolean).join(' '):'';
    L.marker([p.latitude,p.longitude],{icon:chantierIcon}).bindPopup(`<b>🟠 ${escapeHtml(p.libelle)}</b><br>${escapeHtml(p.code)}${clientNom?'<br>Client : '+escapeHtml(clientNom):''}${p.commune?'<br>'+escapeHtml(p.commune):''}<br>Étape : ${escapeHtml(st.label)}<br><a href="#" onclick="window._editId='${p.id}';showPage('projets-add');return false;">Voir la fiche →</a>`).addTo(window._carteProjetLayer);
    bounds.push([p.latitude,p.longitude]);
  });
  (window._carteProspects||[]).forEach(p=>{
    const nom=[p.civilite,p.nom,p.prenoms].filter(Boolean).join(' ')||p.entreprise||'—';
    const st=STATUT_PROSPECT[p.statut]||{label:p.statut};
    L.marker([p.latitude,p.longitude],{icon:prospectIcon}).bindPopup(`<b>🟣 ${escapeHtml(nom)}</b><br>${escapeHtml(p.code)}${p.commune?'<br>'+escapeHtml(p.commune):''}<br>Statut : ${escapeHtml(st.label)}<br><a href="#" onclick="window._editId='${p.id}';showPage('prospects-add');return false;">Voir la fiche →</a>`).addTo(window._carteProspectLayer);
    bounds.push([p.latitude,p.longitude]);
  });
  (window._carteCommerciaux||[]).forEach(c=>{
    const maj=c.position_updated_at?new Date(c.position_updated_at).toLocaleString('fr-FR'):'—';
    L.marker([c.latitude,c.longitude],{icon:commercialIcon}).bindPopup(`<b>🟢 ${escapeHtml(c.nom_complet||'Commercial')}</b><br>Position mise à jour : ${maj}`).addTo(window._carteCommercialLayer);
    bounds.push([c.latitude,c.longitude]);

  if(showClients) window._carteClientLayer.addTo(_carteMap); else _carteMap.removeLayer(window._carteClientLayer);
  if(showChantiers) window._carteProjetLayer.addTo(_carteMap); else _carteMap.removeLayer(window._carteProjetLayer);
  if(showProspects) window._carteProspectLayer.addTo(_carteMap); else _carteMap.removeLayer(window._carteProspectLayer);
  if(showCommerciaux) window._carteCommercialLayer.addTo(_carteMap); else _carteMap.removeLayer(window._carteCommercialLayer);
  if(bounds.length) _carteMap.fitBounds(bounds,{padding:[30,30]}); else _carteMap.setView([5.3364,-4.0267],6);
  const countEl=document.getElementById('carteCount');

}

const ETAPE_MAP_COLORS={en_attente:'#7c3aed',mesure_disponible:'#f59e0b',pret_fabrication:'#eab308',fabrication_en_cours:'#2563eb',installation_en_cours:'#0891b2',termine:'#059669',annule:'#9ca3af'};

function refreshCarteChantiers(){
  if(!_carteChantiersMap) return;
  const etapeFilter=document.getElementById('ccFilterEtape')?.value||'';
  const all=window._ccProjets||[];
  const filtered=all.filter(p=>!etapeFilter||p.etape===etapeFilter);

  _carteChantiersMarkers={};

  const listHtml=filtered.map(p=>{

    const marker=L.marker([p.latitude,p.longitude],{icon}).bindPopup(`<b>${escapeHtml(p.libelle)}</b><br>${escapeHtml(p.code)}<br>Client : ${escapeHtml(clientNom)}${p.commune?'<br>'+escapeHtml(p.commune):''}<br>Étape : ${escapeHtml(st.label)}<br><a href="#" onclick="window._editId='${p.id}';showPage('projets-add');return false;">Voir la fiche →</a>`).addTo(_carteChantiersMap);
    _carteChantiersMarkers[p.id]=marker;
    bounds.push([p.latitude,p.longitude]);
    return `<div class="p-3 border-b cursor-pointer hover:bg-gray-50" onclick="focusChantier('${p.id}')">
      <div class="flex items-center gap-2">
        <span style="width:9px;height:9px;border-radius:50%;background:${color};flex-shrink:0"></span>
        <span class="font-semibold text-sm truncate">${escapeHtml(p.libelle)}</span>
      </div>
      <div class="text-xs text-gray-400 mt-0.5">${escapeHtml(p.code)} · ${escapeHtml(clientNom)}</div>
      <div class="text-xs mt-1" style="color:${color}">${escapeHtml(st.label)}</div>
    </div>`;
  }).join('')||'<div class="p-4 text-sm text-gray-400">Aucun chantier géolocalisé pour ce filtre.</div>';
  const listPanel=document.getElementById('ccListPanel'); if(listPanel) listPanel.innerHTML=listHtml;
  if(bounds.length) _carteChantiersMap.fitBounds(bounds,{padding:[30,30]}); else _carteChantiersMap.setView([5.3364,-4.0267],6);
  const countEl=document.getElementById('ccCount');
  if(countEl) countEl.textContent=`${filtered.length} chantier(s) géolocalisé(s) sur ${all.length} au total`;
}
function focusChantier(id){
  const marker=_carteChantiersMarkers[id]; if(!marker||!_carteChantiersMap) return;
  _carteChantiersMap.flyTo(marker.getLatLng(),16,{duration:0.6});

}

async function refreshProjetsBadges(){
  const {data,error}=await sb.from('projets').select('etape,date_fin');
  if(error) return;
  const today=new Date().toISOString().slice(0,10);
  const counts={en_attente:0,mesure_disponible:0,pret_fabrication:0,fabrication_en_cours:0,installation_en_cours:0,termine:0,annule:0,retard:0};
  data.forEach(p=>{
    if(counts[p.etape]!==undefined) counts[p.etape]++;
    if(p.date_fin && p.date_fin<today && !['termine','annule'].includes(p.etape)) counts.retard++;
  });
  const setTxt=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  setTxt('badgeProjTotal',data.length);
  setTxt('badgeProjAttente',counts.en_attente);
  setTxt('badgeProjMesure',counts.mesure_disponible);
  setTxt('badgeProjPret',counts.pret_fabrication);
  setTxt('badgeProjFabrication',counts.fabrication_en_cours);
  setTxt('badgeProjInstallation',counts.installation_en_cours);
  setTxt('badgeProjTermine',counts.termine);
  setTxt('badgeProjRetard',counts.retard);
  setTxt('badgeProjAnnule',counts.annule);
}

async function dupliquerComposant(id){
  const {data:c,error:e1}=await sb.from('composants').select('*').eq('id',id).single();
  if(e1){ toast(e1.message,'error'); return; }
  const copy={...c}; delete copy.id; delete copy.created_at;
  if(copy.code){
    const {data:existing}=await sb.from('composants').select('standing').eq('code',copy.code);
    const used=new Set((existing||[]).map(r=>r.standing));
    const next=Object.keys(COMPOSANT_STANDINGS).find(s=>!used.has(s));
    if(next){ copy.standing=next; copy.nom=c.nom+' — '+COMPOSANT_STANDINGS[next].label; }
    else copy.nom=copy.nom+' (copie)';
  } else copy.nom=copy.nom+' (copie)';
  const {data:newC,error}=await sb.from('composants').insert(copy).select().single();
  if(error){ toast(error.message,'error'); return; }
  toast(copy.code?`Variante ${COMPOSANT_STANDINGS[copy.standing]?.label||''} créée pour ${copy.code} — ajustez son prix.`:'Composant dupliqué — modifiez ses caractéristiques.');
  window._editId=newC.id; showPage('composants-add');
}

const STOCK_TYPE_LABELS={entree:{label:'Entrée',color:'#059669',icon:'⬇️'},sortie:{label:'Sortie',color:'#dc2626',icon:'⬆️'},ajustement:{label:'Ajustement',color:'#7c3aed',icon:'⚖️'},inventaire:{label:'Inventaire',color:'#2563eb',icon:'🧮'}};

function stockValeur(c){ return (+c.stock_actuel||0)*(+c.cmup||0); }
async function renderStockDashboard(el){
  const [{data:composants},{data:mouvements}]=await Promise.all([
    sb.from('composants').select('*'),
    sb.from('mouvements_stock').select('*, composants(nom,famille)').order('created_at',{ascending:true})
  ]);
  const valeurTotale=composants.reduce((s,c)=>s+stockValeur(c),0);
  const ruptures=composants.filter(c=>(+c.stock_actuel||0)<(+c.stock_min||0));
  const surstocks=composants.filter(c=>c.stock_max!=null&&(+c.stock_actuel||0)>(+c.stock_max));
  const il30j=new Date(Date.now()-30*86400000);
  const mvt30j=mouvements.filter(m=>new Date(m.created_at)>=il30j);
  el.innerHTML=`
    <div class="grid sm:grid-cols-4 gap-3 mb-4">
      <div class="card p-4"><div class="text-xs text-gray-400 font-semibold uppercase">Valeur totale du stock</div><div class="text-2xl font-black mt-1" style="color:var(--accent)">${money(valeurTotale)}</div></div>
      <div class="card p-4"><div class="text-xs text-gray-400 font-semibold uppercase">Ruptures (sous seuil min)</div><div class="text-2xl font-black mt-1" style="color:#dc2626">${ruptures.length}</div></div>
      <div class="card p-4"><div class="text-xs text-gray-400 font-semibold uppercase">Surstocks (au-dessus max)</div><div class="text-2xl font-black mt-1" style="color:#d97706">${surstocks.length}</div></div>
      <div class="card p-4"><div class="text-xs text-gray-400 font-semibold uppercase">Mouvements (30 derniers jours)</div><div class="text-2xl font-black mt-1" style="color:#2563eb">${mvt30j.length}</div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-3 mb-3">
      <div class="card p-4"><h3 class="text-sm font-bold mb-2">📈 Évolution de la valeur du stock</h3><div style="height:260px"><canvas id="chartStockValeur"></canvas></div></div>
      <div class="card p-4"><h3 class="text-sm font-bold mb-2">🥯 Valeur du stock par famille</h3><div style="height:260px"><canvas id="chartStockFamille"></canvas></div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-3 mb-3">
      <div class="card p-4"><h3 class="text-sm font-bold mb-2">🔥 Top 5 consommations (30j)</h3><div style="height:260px"><canvas id="chartStockTop"></canvas></div></div>
      <div class="card p-4"><h3 class="text-sm font-bold mb-2">🔄 Entrées / Sorties par jour (14j)</h3><div style="height:260px"><canvas id="chartStockFlux"></canvas></div></div>
    </div>
    ${ruptures.length?`<div class="card p-4">
      <h3 class="text-sm font-bold mb-2 text-red-600">🔴 En rupture — action requise</h3>
      <table><thead><tr><th>Composant</th><th class="text-right">Stock</th><th class="text-right">Seuil min</th><th></th></tr></thead>
      <tbody>${ruptures.map(c=>`<tr><td>${escapeHtml(c.nom)}</td><td class="text-right">${(+c.stock_actuel).toFixed(1)} ${escapeHtml(c.unite)}</td><td class="text-right">${(+c.stock_min).toFixed(1)}</td>
      <td class="text-right"><button class="text-xs font-semibold text-emerald-600" onclick="openMouvementModal('entree','${c.id}')">⬇️ Réapprovisionner</button></td></tr>`).join('')}</tbody></table>
    </div>`:''}`;

  // --- Chart 1 : évolution valeur du stock (replay chronologique des mouvements) ---
  const running={}; let total=0; const points=[];
  mouvements.forEach(m=>{
    const prev=running[m.composant_id]||0;
    const now=(+m.stock_apres||0)*(+m.cmup_apres||0);
    total+=(now-prev);
    running[m.composant_id]=now;
    points.push({date:new Date(m.created_at).toLocaleDateString('fr-FR'),total});
  });
  const byDay={}; points.forEach(p=>{ byDay[p.date]=p.total; });
  const labels1=Object.keys(byDay);
  const data1=Object.values(byDay);
  if(!labels1.length){ labels1.push("Aujourd'hui"); data1.push(valeurTotale); }
  renderStockChart('chartStockValeur','line',{labels:labels1,datasets:[{label:'Valeur du stock (FCFA)',data:data1,borderColor:'#6d28d9',backgroundColor:'rgba(109,40,217,.12)',fill:true,tension:.25}]});

  // --- Chart 2 : valeur par famille (donut) ---
  const parFamille={};
  composants.forEach(c=>{ const f=c.famille||'Autre'; parFamille[f]=(parFamille[f]||0)+stockValeur(c); });
  const famEntries=Object.entries(parFamille).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  renderStockChart('chartStockFamille','doughnut',{labels:famEntries.map(e=>e[0]),datasets:[{data:famEntries.map(e=>e[1]),backgroundColor:famEntries.map(e=>COMPOSANT_FAM_COLORS[e[0]]||'#6b7280')}]});

  // --- Chart 3 : top 5 consommations 30j ---
  const consoParComposant={};
  mvt30j.filter(m=>m.type==='sortie').forEach(m=>{ const nom=m.composants?.nom||'—'; consoParComposant[nom]=(consoParComposant[nom]||0)+Math.abs(+m.quantite); });
  const top5=Object.entries(consoParComposant).sort((a,b)=>b[1]-a[1]).slice(0,5);
  renderStockChart('chartStockTop','bar',{labels:top5.map(e=>e[0]),datasets:[{label:'Quantité sortie',data:top5.map(e=>e[1]),backgroundColor:'#dc2626'}]},{indexAxis:'y'});

  // --- Chart 4 : flux entrées/sorties 14 derniers jours (valorisés) ---
  const jours=[]; for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*86400000); jours.push(d.toLocaleDateString('fr-FR')); }
  const entreesParJour=Object.fromEntries(jours.map(j=>[j,0])), sortiesParJour=Object.fromEntries(jours.map(j=>[j,0]));
  mouvements.forEach(m=>{
    const j=new Date(m.created_at).toLocaleDateString('fr-FR');
    if(!(j in entreesParJour)) return;
    if(m.type==='entree') entreesParJour[j]+=(+m.quantite)*(+(m.prix_unitaire??m.cmup_apres)||0);
    else if(m.type==='sortie') sortiesParJour[j]+=Math.abs(+m.quantite)*(+m.cmup_apres||0);
  });
  renderStockChart('chartStockFlux','bar',{labels:jours,datasets:[
    {label:'Entrées',data:jours.map(j=>entreesParJour[j]),backgroundColor:'#059669'},
    {label:'Sorties',data:jours.map(j=>sortiesParJour[j]),backgroundColor:'#dc2626'}
  ]});
}

/* ---------- Décharge de stock depuis une Fiche d'exécution terminée ---------- */
async function proposerDechargeStock(ficheId){
  const {data:fiche}=await sb.from('fiches_execution').select('id,code,devis_id').eq('id',ficheId).single();
  if(!fiche) return;
  const {data:lignesFiche}=await sb.from('fiche_execution_lignes').select('devis_ligne_id').eq('fiche_id',ficheId);
  const devisLigneIds=(lignesFiche||[]).map(l=>l.devis_ligne_id).filter(Boolean);
  if(!devisLigneIds.length) return;
  const {data:devisLignes}=await sb.from('devis_lignes').select('id,largeur,hauteur,quantite,produit_id').in('id',devisLigneIds);
  const produitIds=[...new Set((devisLignes||[]).map(l=>l.produit_id).filter(Boolean))];
  if(!produitIds.length) return;
  const {data:produits}=await sb.from('produits').select('id,nom,config_json').in('id',produitIds);
  const produitMap=Object.fromEntries((produits||[]).map(p=>[p.id,p]));
  const {data:composants}=await sb.from('composants').select('id,nom,code,unite,standing,prix_unitaire').not('code','is',null);
  window._composantsPriceMap=buildComposantsPriceMap(composants);
  const composantsByCode={};
  (composants||[]).forEach(c=>{ composantsByCode[c.code]=composantsByCode[c.code]||{}; composantsByCode[c.code][c.standing||'standard']=c; });
  const resolveComposant=(code,standing)=>{ const v=composantsByCode[code]; if(!v) return null; return v[standing]||v.standard||Object.values(v)[0]||null; };

  const besoins={}; // code -> {qty, composant}
  (devisLignes||[]).forEach(l=>{
    const produit=produitMap[l.produit_id];
    if(!produit?.config_json) return;
    const c=produit.config_json;
    const standing=c.standing||'standard';
    const res=configCalculerBOM(c.type,+l.largeur||0,+l.hauteur||0,c.leaves||1,+l.quantite||1,{jointType:c.jointType,gap:c.gap,spacing:c.spacing,infill:c.infill,standing});
    res.rows.forEach(r=>{
      const composant=resolveComposant(r[0],standing);
      if(!composant) return;
      besoins[r[0]]=besoins[r[0]]||{composant,qty:0};
      besoins[r[0]].qty+=+r[2]||0;
    });
  });
  const items=Object.values(besoins).filter(b=>b.qty>0);
  if(!items.length) return;

  openModal(`
    <h2 class="text-lg font-bold mb-1">📦 Décharger le stock — Fiche ${escapeHtml(fiche.code)}</h2>
    <div class="divider"></div>
    <p class="text-xs text-gray-500 mb-3">D'après la nomenclature (BOM) des produits configurés de cette fiche. Décochez ce qui ne doit pas être décompté.</p>
    <div class="overflow-x-auto mb-4"><table><thead><tr><th></th><th>Composant</th><th class="text-right">Quantité à sortir</th></tr></thead>
    <tbody>${items.map((it,i)=>`<tr>
      <td><input type="checkbox" checked id="dc_${i}"></td>
      <td>${escapeHtml(it.composant.nom)}</td>
      <td class="text-right">${it.qty.toFixed(2)} ${escapeHtml(it.composant.unite)}</td>
    </tr>`).join('')}</tbody></table></div>
    <div class="flex justify-end gap-2">
      <button class="btn btn-outline" onclick="closeModal()">Ignorer</button>
      <button class="btn btn-primary px-8" onclick='confirmerDechargeStock(${JSON.stringify(items.map(it=>({id:it.composant.id,qty:it.qty})))},"${escapeHtml(fiche.code)}")'>✔ Décharger le stock</button>
    </div>`);
  window._dechargeItems=items;
}
async function confirmerDechargeStock(items,ficheCode){
  let n=0;
  for(let i=0;i<items.length;i++){
    if(!document.getElementById('dc_'+i)?.checked) continue;
    const {error}=await sb.rpc('stock_mouvement',{p_composant_id:items[i].id,p_type:'sortie',p_quantite:items[i].qty,p_motif:"Fiche d'exécution",p_reference:ficheCode,p_prix_unitaire:null});
    if(!error) n++;
  }
  toast(`Stock déchargé (${n} composant(s)).`);
  closeModal(); refreshStockAlertesBadge();
}

function toggleSimDevis(id,checked){
  const state=window._simDebit; if(!state) return;
  if(checked) state.selected.add(id); else state.selected.delete(id);
}
function packStrategyTagged(sorted,barLen,kerf,mode){
  let remaining=[], barCuts=[];
  sorted.forEach(item=>{
    const cLen=item.len;
    let i=-1;
    if(mode==='best'){
      let bestSlack=Infinity;
      remaining.forEach((r,idx)=>{ if(r>=cLen+kerf){ const slack=r-(cLen+kerf); if(slack<bestSlack){ bestSlack=slack; i=idx; } } });
    } else {
      i=remaining.findIndex(r=>r>=cLen+kerf);
    }
    if(i<0){ remaining.push(barLen-cLen-kerf); barCuts.push([item]); }
    else{ barCuts[i].push(item); remaining[i]-=cLen+kerf; }
  });
  const bars=barCuts.map((cuts,i)=>({cuts,used:cuts.reduce((a,b)=>a+b.len+kerf,0),chute:remaining[i]}));
  return {bars,nbBarres:bars.length,chuteTotale:bars.reduce((s,b)=>s+b.chute,0)};
}
function binPackCutsTagged(items,barLen,kerf){
  const sorted=[...items].sort((a,b)=>b.len-a.len);
  const best=packStrategyTagged(sorted,barLen,kerf,'best');
  const first=packStrategyTagged(sorted,barLen,kerf,'first');
  return (best.nbBarres<first.nbBarres) ? best.bars : (first.nbBarres<best.nbBarres) ? first.bars : (best.chuteTotale<=first.chuteTotale?best.bars:first.bars);
}
async function lancerSimulationDebit(){
  const state=window._simDebit;
  state.barLen=+val('simBarLen')||6000;
  state.kerf=+val('simKerf')||0;
  state.sheetW=+val('simSheetW')||3210;
  state.sheetH=+val('simSheetH')||2250;
  state.glassKerf=+val('simGlassKerf')||0;
  const ids=[...state.selected];
  if(ids.length<2){ toast('Sélectionnez au moins 2 devis à combiner.','error'); return; }
  const {data:lignes}=await sb.from('devis_lignes').select('id,devis_id,largeur,hauteur,quantite,produit_id').in('devis_id',ids);
  const produitIds=[...new Set((lignes||[]).map(l=>l.produit_id).filter(Boolean))];
  const {data:produits}=produitIds.length?await sb.from('produits').select('id,config_json').in('id',produitIds):{data:[]};
  const produitMap=Object.fromEntries((produits||[]).map(p=>[p.id,p]));

  const cutsByCode={}; // code -> {label, cuts:[{len,devisId}]}
  const cutsByDevisByCode={}; // devisId -> code -> [len,...]
  const panelsByCode={}; // code -> {label, panels:[{w,h,devisId}]}
  const panelsByDevisByCode={}; // devisId -> code -> [{w,h},...]
  (lignes||[]).forEach(l=>{
    const p=produitMap[l.produit_id];
    if(!p?.config_json) return;
    const c=p.config_json;
    const res=configCalculerBOM(c.type,+l.largeur||0,+l.hauteur||0,c.leaves||1,+l.quantite||1,{jointType:c.jointType,gap:c.gap,spacing:c.spacing,infill:c.infill,standing:c.standing});
    res.rows.forEach(r=>{
      const [code,label,qty,longueur]=r;
      if(!(longueur>0) || classifyBOMLine(label)==='remplissage') return;
      const q=Math.max(1,Math.round(qty));
      cutsByCode[code]=cutsByCode[code]||{label,cuts:[]};
      cutsByDevisByCode[l.devis_id]=cutsByDevisByCode[l.devis_id]||{};
      cutsByDevisByCode[l.devis_id][code]=cutsByDevisByCode[l.devis_id][code]||[];
      for(let i=0;i<q;i++){
        cutsByCode[code].cuts.push({len:Math.round(longueur),devisId:l.devis_id});
        cutsByDevisByCode[l.devis_id][code].push(Math.round(longueur));
      }
    });
    (res.glassPanels||[]).forEach(gp=>{
      if(!gp.code||!(gp.w>0)||!(gp.h>0)) return;
      const row=res.rows.find(rr=>rr[0]===gp.code);
      const label=row?row[1]:gp.code;
      panelsByCode[gp.code]=panelsByCode[gp.code]||{label,panels:[]};
      panelsByDevisByCode[l.devis_id]=panelsByDevisByCode[l.devis_id]||{};
      panelsByDevisByCode[l.devis_id][gp.code]=panelsByDevisByCode[l.devis_id][gp.code]||[];
      for(let i=0;i<gp.qty;i++){
        panelsByCode[gp.code].panels.push({w:gp.w,h:gp.h,devisId:l.devis_id});
        panelsByDevisByCode[l.devis_id][gp.code].push({w:gp.w,h:gp.h});
      }
    });
  });

  const codes=Object.keys(cutsByCode);
  const glassCodes=Object.keys(panelsByCode);
  if(!codes.length && !glassCodes.length){ toast('Aucun profil ni vitrage à débiter pour ces devis.','error'); return; }

  const detail=codes.map(code=>{
    const g=cutsByCode[code];
    const groupedBars=binPackCutsTagged(g.cuts,state.barLen,state.kerf);
    let sepBars=[]; const sepBarsByDevis={};
    ids.forEach(did=>{
      const cuts=(cutsByDevisByCode[did]&&cutsByDevisByCode[did][code])||[];
      if(cuts.length){ const bars=binPackCuts(cuts,state.barLen,state.kerf); sepBarsByDevis[did]=bars; sepBars=sepBars.concat(bars); }
    });
    const nbGroupe=groupedBars.length, nbSepare=sepBars.length;
    const chuteGroupe=groupedBars.reduce((s,b)=>s+b.chute,0);
    const chuteSepare=sepBars.reduce((s,b)=>s+b.chute,0);
    const coutBarre=getPrix(code,'standard',0)*(state.barLen/1000);
    const barresEconomisees=nbSepare-nbGroupe;
    return {code,label:g.label,nbPieces:g.cuts.length,nbGroupe,nbSepare,chuteGroupe,chuteSepare,barresEconomisees,economieFcfa:barresEconomisees*coutBarre,groupedBars,sepBarsByDevis};
  }).sort((a,b)=>b.economieFcfa-a.economieFcfa);

  const surfaceFeuille=state.sheetW*state.sheetH/1e6;
  const glassDetail=glassCodes.map(code=>{
    const g=panelsByCode[code];
    const groupedSheets=packGlassSheetsTagged(g.panels,state.sheetW,state.sheetH,state.glassKerf);
    let sepSheets=[]; const sepSheetsByDevis={};
    ids.forEach(did=>{
      const panels=(panelsByDevisByCode[did]&&panelsByDevisByCode[did][code])||[];
      if(panels.length){ const sheets=packGlassSheets(panels.map(p=>({w:p.w,h:p.h,qty:1})),state.sheetW,state.sheetH,state.glassKerf); sepSheetsByDevis[did]=sheets; sepSheets=sepSheets.concat(sheets); }
    });
    const nbGroupe=groupedSheets.length, nbSepare=sepSheets.length;
    const surfacePieces=g.panels.reduce((s,p)=>s+p.w*p.h/1e6,0);
    const surfaceGroupe=nbGroupe*surfaceFeuille, surfaceSepare=nbSepare*surfaceFeuille;
    const coutFeuille=getPrix(code,'standard',0)*surfaceFeuille;
    const feuillesEconomisees=nbSepare-nbGroupe;
    return {code,label:g.label,nbPieces:g.panels.length,surfacePieces,nbGroupe,nbSepare,surfaceGroupe,surfaceSepare,feuillesEconomisees,economieFcfa:feuillesEconomisees*coutFeuille,groupedSheets,sepSheetsByDevis};
  }).sort((a,b)=>b.economieFcfa-a.economieFcfa);

  window._simDebit.result={
    detail,
    totNbGroupe:detail.reduce((s,d)=>s+d.nbGroupe,0),
    totNbSepare:detail.reduce((s,d)=>s+d.nbSepare,0),
    totChuteGroupe:detail.reduce((s,d)=>s+d.chuteGroupe,0),
    totChuteSepare:detail.reduce((s,d)=>s+d.chuteSepare,0),
    totEconomie:detail.reduce((s,d)=>s+d.economieFcfa,0),
    glassDetail,
    totFeuillesGroupe:glassDetail.reduce((s,d)=>s+d.nbGroupe,0),
    totFeuillesSepare:glassDetail.reduce((s,d)=>s+d.nbSepare,0),
    totSurfaceGroupe:glassDetail.reduce((s,d)=>s+d.surfaceGroupe,0),
    totSurfaceSepare:glassDetail.reduce((s,d)=>s+d.surfaceSepare,0),
    totEconomieVitrage:glassDetail.reduce((s,d)=>s+d.economieFcfa,0),
    ids, barLen:state.barLen, kerf:state.kerf, sheetW:state.sheetW, sheetH:state.sheetH, glassKerf:state.glassKerf
  };
  renderSimDebitResult();
}
function renderSimDebitResult(){
  const r=window._simDebit.result;
  const box=document.getElementById('simDebitResult');
  if(!r||!box) return;
  const barresEco=r.totNbSepare-r.totNbGroupe;
  const pctEco=r.totNbSepare?((barresEco/r.totNbSepare)*100).toFixed(1):'0.0';
  const pctChute=r.totChuteSepare?(((r.totChuteSepare-r.totChuteGroupe)/r.totChuteSepare)*100).toFixed(1):'0.0';
  const feuillesEco=r.totFeuillesSepare-r.totFeuillesGroupe;

/* ============================== CONFIGURATEUR D'OUVRAGE ============================== */
/* BOM paramétrique portée depuis sanix-alu-expet-erp.vercel.app (Configurateur d'ouvrage),
   restreinte aux types du catalogue BEDA ALU. Les formules Fenêtre/Porte/Coulissant/
   Coulissant galandage et Garde-corps inox sont reprises à l'identique ; Moustiquaire et
   Fenêtre jalousie sont des formules analogues (pas d'équivalent côté Sanix). */
const CONFIG_TYPES=['Fenêtre coulissante','Porte à la française','Porte coulissante','Coulissant galandage','Fenêtre jalousie','Moustiquaire fixe','Moustiquaire coulissante','Garde-corps inox'];
/* Prix unitaires lus depuis la table composants (catalogue Composants & Consommables) — voir
   window._composantsPriceMap, chargée par buildComposantsPriceMap(). Structure : { code: { standing: prix } }.
   Le 3e argument de getPrix est un secours si le composant a été supprimé du catalogue,
   pour ne jamais casser un devis. */
function buildComposantsPriceMap(rows){
  const map={};
  (rows||[]).forEach(r=>{
    map[r.code]=map[r.code]||{};
    map[r.code][r.standing||'standard']=+r.prix_unitaire;
  });
  return map;
}
function getPrix(code,standing,fallback){
  const variants=window._composantsPriceMap&&window._composantsPriceMap[code];
  if(!variants) return fallback;
  if(variants[standing]!=null) return variants[standing];
  if(variants.standard!=null) return variants.standard;
  const any=Object.values(variants).find(v=>v!=null);
  return any!=null?any:fallback;
}
function configCalculerBOM(type,w,h,leaves,qty,opts){
  opts=opts||{};
  const standing=opts.standing||'standard';
  const perimeter=2*(w+h);
  let rows=[], alu=0, glassArea=0, glassPanels=[];
  if(type==='Garde-corps inox'){
    const spacing=Math.max(500,+opts.spacing||1500);
    const infill=opts.infill||'cable';
    const nPoteaux=Math.max(2,Math.ceil(w/spacing)+1);
    const nPanels=nPoteaux-1;
    glassArea=infill==='verre'?(w/nPanels*h/1000000)*nPanels*qty:0;
    alu=(nPoteaux*h+w)*qty/1000;
    rows=[
      ['POT-GI-001','Poteau inox tube 42.4mm',nPoteaux*qty,h,nPoteaux*qty*(h/1000)*getPrix('POT-GI-001',standing,22500)],
      ['MC-GI-001','Main courante inox',qty,w,qty*(w/1000)*getPrix('MC-GI-001',standing,16800)],
      ['PLA-GI-001','Platine fixation inox',nPoteaux*qty,0,nPoteaux*qty*getPrix('PLA-GI-001',standing,3800)],
      ...(infill==='cable' ? [
        ['CAB-GI-001','Câble inox Ø6mm tendu',Math.ceil(h/110)*qty,w,Math.ceil(h/110)*qty*(w/1000)*getPrix('CAB-GI-001',standing,4.5)],
        ['TEN-GI-001','Tendeur + terminaison sertie',2*Math.ceil(h/110)*qty,0,2*Math.ceil(h/110)*qty*getPrix('TEN-GI-001',standing,1800)]
      ] : infill==='barreaudage' ? [
        ['BAR-GI-001','Barreau vertical inox Ø12mm',Math.ceil(w/110)*qty,h,Math.ceil(w/110)*qty*(h/1000)*getPrix('BAR-GI-001',standing,8200)]
      ] : [
        ['VIT-GI-001','Verre feuilleté sécurit',nPanels*qty,Math.round(w/nPanels*h/1000),glassArea*getPrix('VIT-GI-001',standing,9500)],
        ['PIN-GI-001','Pince de fixation verre inox',4*nPanels*qty,0,4*nPanels*qty*getPrix('PIN-GI-001',standing,2400)]
      ])
    ];
    if(infill==='verre') glassPanels=[{code:'VIT-GI-001',w:Math.round(w/nPanels),h,qty:nPanels*qty}];
  } else if(type==='Moustiquaire fixe' || type==='Moustiquaire coulissante'){
    const isCoul=type==='Moustiquaire coulissante';
    const ouvrantW=isCoul?Math.max(0,w/leaves):w;
    glassArea=0;
    alu=(perimeter+(isCoul?leaves*(2*ouvrantW+2*h):0))*qty/1000;
    rows=[
      ['CAD-MO-001','Cadre aluminium moustiquaire',isCoul?2*leaves*qty:2*qty,isCoul?ouvrantW:w,(isCoul?2*leaves*ouvrantW:2*w)*qty/1000*getPrix('CAD-MO-001',standing,3800)],
      ['CAD-MO-002','Traverse aluminium moustiquaire',isCoul?2*leaves*qty:2*qty,h,(isCoul?2*leaves*h:2*h)*qty/1000*getPrix('CAD-MO-002',standing,3800)],
      ['TUL-MO-001','Toile moustiquaire (fibre de verre)',qty,Math.round(w*h/1000),(w*h/1000000)*qty*getPrix('TUL-MO-001',standing,3200)],
      ...(isCoul ? [
        ['RAI-MO-001','Rail coulissant moustiquaire',qty,w,qty*(w/1000)*getPrix('RAI-MO-001',standing,4200)],
        ['ROU-MO-001','Roulette coulissante',2*leaves*qty,0,2*leaves*qty*getPrix('ROU-MO-001',standing,950)]
      ] : [
        ['LOQ-MO-001','Loquet de fermeture',qty,0,qty*getPrix('LOQ-MO-001',standing,1200)]
      ])
    ];
  } else if(type==='Fenêtre jalousie'){
    const nLames=Math.max(3,Math.round(h/120));
    glassArea=(w*h/1000000)*qty;
    alu=(perimeter+nLames*w/1000)*qty/1000;
    rows=[
      ['CAD-FJ-001','Cadre dormant jalousie',2*qty,w,2*qty*(w/1000)*getPrix('CAD-FJ-001',standing,8500)],
      ['CAD-FJ-002','Montant dormant jalousie',2*qty,h,2*qty*(h/1000)*getPrix('CAD-FJ-002',standing,8500)],
      ['LAM-FJ-001','Lame de verre jalousie 5mm',nLames*qty,w,glassArea*getPrix('LAM-FJ-001',standing,4800)],
      ['MEC-FJ-001','Mécanisme à manivelle',qty,0,qty*getPrix('MEC-FJ-001',standing,6500)],
      ['CLI-FJ-001','Clip de fixation lame',nLames*2*qty,0,nLames*2*qty*getPrix('CLI-FJ-001',standing,350)]
    ];
    glassPanels=[{code:'LAM-FJ-001',w,h:Math.round(h/nLames),qty:nLames*qty}];
  } else {
    const jointType=opts.jointType||'onglet';
    const gap=+opts.gap||5;
    const isPorte=type==='Porte à la française';
    const isGalandage=type==='Coulissant galandage';
    const ouvrantW=Math.max(0,(w-(leaves-1)*45)/leaves);
    const glassRebate=107+3;
    const glassW=Math.max(0,ouvrantW-glassRebate-gap);
    const glassH=Math.max(0,h-glassRebate-gap);
    glassArea=glassW*glassH/1000000*leaves*qty;
    alu=(perimeter+leaves*(2*ouvrantW+2*h))*qty/1000;
    const quiCode1=isPorte?'QUI-001-PORTE':'QUI-001';
    const quiCode2=isPorte?'QUI-002-PORTE':isGalandage?'QUI-002-GALANDAGE':'QUI-002';
    rows=[
      ['P-STD-001','Dormant horizontal',2*qty,w,2*qty*(w/1000)*getPrix('P-STD-001',standing,8500)],
      ['P-STD-002','Dormant vertical',2*qty,h,2*qty*(h/1000)*getPrix('P-STD-002',standing,8500)],
      ['P-STD-003','Ouvrant horizontal',2*leaves*qty,ouvrantW,2*leaves*qty*(ouvrantW/1000)*getPrix('P-STD-003',standing,9200)],
      ['P-STD-004','Ouvrant vertical',2*leaves*qty,h,2*leaves*qty*(h/1000)*getPrix('P-STD-004',standing,9200)],
      ['P-PAR-001','Parclose',4*leaves*qty,glassW,4*leaves*qty*(glassW/1000)*getPrix('P-PAR-001',standing,3200)],
      ['VIT-001','Double vitrage 6/12/6',leaves*qty,glassW*glassH/1000000,glassArea*getPrix('VIT-001',standing,6500)],
      ['JNT-001','Joint vitrage',2*(glassW+glassH)*leaves*qty/1000,0,2*(glassW+glassH)*leaves*qty/1000*getPrix('JNT-001',standing,900)],
      [quiCode1,isPorte?'Ensemble serrure + poignée':'Poignée',leaves*qty,0,leaves*qty*getPrix(quiCode1,standing,isPorte?12500:4500)],
      [quiCode2,isPorte?'Paumelle renforcée':isGalandage?'Roulette renforcée galandage':'Paumelle',(isPorte?3:2)*leaves*qty,0,(isPorte?3:2)*leaves*qty*getPrix(quiCode2,standing,isPorte?1600:isGalandage?2100:850)],
      ...(isPorte ? [['P-SEU-001','Seuil bas renforcé',qty,w,qty*(w/1000)*getPrix('P-SEU-001',standing,11500)],['QUI-003','Gâche + ferme-porte',qty,0,qty*getPrix('QUI-003',standing,7800)]] : []),
      ...(isGalandage ? [
        ['CAI-001','Caisson de galandage',leaves*qty,ouvrantW,leaves*qty*(ouvrantW/1000)*getPrix('CAI-001',standing,14500)],
        ['RAIL-001','Rail double renforcé galandage',qty,w,qty*(w/1000)*getPrix('RAIL-001',standing,12800)],
        ['SAN-001','Sangle de finition caisson',leaves*qty,h,leaves*qty*(h/1000)*getPrix('SAN-001',standing,3500)],
        ['BRO-001','Joint brosse étanchéité',2*leaves*qty,h,2*leaves*qty*(h/1000)*getPrix('BRO-001',standing,1100)]
      ] : []),
      ['CON-001','Silicone',Math.max(1,Math.ceil(perimeter*qty/5000)),0,Math.max(1,Math.ceil(perimeter*qty/5000))*getPrix('CON-001',standing,2800)],
      (()=>{
        const n=4*(1+leaves)*qty;
        const fallback={onglet:1500,equerre:1200,about:900}[jointType]||1200;
        const code={onglet:'JNT-ONG-001',equerre:'JNT-EQ-001',about:'JNT-ABT-001'}[jointType];
        const label={onglet:"Jonction onglet 45° (colle+sertissage)",equerre:"Équerre d'angle mécanique",about:'Aboutage 90° + vis'}[jointType];
        return [code,label,n,0,n*getPrix(code,standing,fallback)];

/* ---------- Classification BOM (structure/mobile/vitrage/quincaillerie), portée de Sanix ---------- */
const BOM_L1_CATEGORIES=[
  {key:'structure',label:'Structure / Ossature',icon:'🏗️'},
  {key:'mobile',label:'Éléments mobiles / Ouvrants',icon:'🚪'},
  {key:'remplissage',label:'Vitrage / Remplissage',icon:'🪟'},
  {key:'quincaillerie',label:'Quincaillerie & Consommables',icon:'🔩'}
];
const BOM_L1_KEYWORDS={
  structure:['dormant','montant','traverse','meneau','poteau','limon','cadre','ossature'],
  mobile:['ouvrant','vantail','lame','tablier'],
  remplissage:['vitrage','verre','toile','parclose'],
  quincaillerie:['vis','joint','poignée','serrure','paumelle','roulette','silicone','moteur','manivelle','tendeur','pince','clip','platine','sangle','équerre','gâche','ferme-porte','fixation','câble','capot','jonction','loquet','mécanisme','seuil','rail','caisson']
};
function classifyBOMLine(designation){
  const d=String(designation).toLowerCase();
  for(const [l1,keywords] of Object.entries(BOM_L1_KEYWORDS)){
    if(keywords.some(k=>d.includes(k))) return l1;
  }
  return 'structure';
}

/* ---------- Débit / optimisation des barres (bin-packing First-Fit / Best-Fit), porté de Sanix ---------- */
function packStrategy(sorted,barLen,kerf,mode){
  let remaining=[], barCuts=[];
  sorted.forEach(cLen=>{
    let i=-1;
    if(mode==='best'){
      let bestSlack=Infinity;
      remaining.forEach((r,idx)=>{ if(r>=cLen+kerf){ const slack=r-(cLen+kerf); if(slack<bestSlack){ bestSlack=slack; i=idx; } } });
    } else {
      i=remaining.findIndex(r=>r>=cLen+kerf);
    }
    if(i<0){ remaining.push(barLen-cLen-kerf); barCuts.push([cLen]); }
    else{ barCuts[i].push(cLen); remaining[i]-=cLen+kerf; }
  });
  const bars=barCuts.map((cuts,i)=>({cuts,used:cuts.reduce((a,b)=>a+b+kerf,0),chute:remaining[i]}));
  return {bars,nbBarres:bars.length,chuteTotale:bars.reduce((s,b)=>s+b.chute,0)};
}
function binPackCuts(cuts,barLen,kerf){
  const sorted=[...cuts].sort((a,b)=>b-a);
  const best=packStrategy(sorted,barLen,kerf,'best');
  const first=packStrategy(sorted,barLen,kerf,'first');
  return (best.nbBarres<first.nbBarres) ? best.bars : (first.nbBarres<best.nbBarres) ? first.bars : (best.chuteTotale<=first.chuteTotale?best.bars:first.bars);
}

/* ---------- Optimisation de vitrage — bin-packing 2D par étagères (shelf FFDH, rotation 90° autorisée) ---------- */
function packGlassSheets(panels,sheetW,sheetH,kerf){
  let pieces=[];
  panels.forEach(p=>{ for(let i=0;i<p.qty;i++) pieces.push({w:p.w,h:p.h}); });
  pieces.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));
  const sheets=[];
  let sheet=null;
  function newSheet(){ sheet={shelves:[],usedHeight:0}; sheets.push(sheet); }
  newSheet();
  pieces.forEach(p=>{
    const orients=[[p.w,p.h],[p.h,p.w]];
    let placed=false;
    for(const shelf of sheet.shelves){
      for(const [pw,ph] of orients){
        if(ph<=shelf.height+0.01 && shelf.usedWidth+pw+kerf<=sheetW+0.01){
          shelf.items.push({x:shelf.usedWidth,y:shelf.y,w:pw,h:ph});
          shelf.usedWidth+=pw+kerf;
          placed=true; break;
        }
      }
      if(placed) break;
    }
    if(!placed){
      for(const [pw,ph] of orients){
        if(pw<=sheetW+0.01 && sheet.usedHeight+ph+kerf<=sheetH+0.01){
          sheet.shelves.push({y:sheet.usedHeight,height:ph,usedWidth:pw+kerf,items:[{x:0,y:sheet.usedHeight,w:pw,h:ph}]});
          sheet.usedHeight+=ph+kerf;
          placed=true; break;
        }
      }
    }
    if(!placed){
      newSheet();
      const orient=(p.w<=sheetW && p.h<=sheetH)?[p.w,p.h]:[p.h,p.w];
      sheet.shelves.push({y:0,height:orient[1],usedWidth:orient[0]+kerf,items:[{x:0,y:0,w:orient[0],h:orient[1]}]});
      sheet.usedHeight=orient[1]+kerf;
    }
  });
  sheets.forEach(sh=>{
    sh.chutes=[];
    sh.shelves.forEach(shelf=>{
      const w=sheetW-shelf.usedWidth;
      if(w>1) sh.chutes.push({w:Math.round(w),h:Math.round(shelf.height),x:Math.round(shelf.usedWidth),y:Math.round(shelf.y),bottom:false});
    });
    const hBas=sheetH-sh.usedHeight;
    if(hBas>1) sh.chutes.push({w:sheetW,h:Math.round(hBas),x:0,y:Math.round(sh.usedHeight),bottom:true});
  });
  return sheets;
}
/* Variante taguée de packGlassSheets : conserve le devisId d'origine de chaque panneau à
   travers l'imbrication 2D, pour le Simulateur multi-chantiers (traçabilité + visuel couleur).
   `pieces` est déjà à plat (une entrée par panneau, qty déjà expansé), contrairement à
   packGlassSheets qui reçoit des {w,h,qty} groupés. */
function packGlassSheetsTagged(pieces,sheetW,sheetH,kerf){
  const sorted=[...pieces].sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));
  const sheets=[];
  let sheet=null;
  function newSheet(){ sheet={shelves:[],usedHeight:0}; sheets.push(sheet); }
  newSheet();
  sorted.forEach(p=>{
    const orients=[[p.w,p.h],[p.h,p.w]];
    let placed=false;
    for(const shelf of sheet.shelves){
      for(const [pw,ph] of orients){
        if(ph<=shelf.height+0.01 && shelf.usedWidth+pw+kerf<=sheetW+0.01){
          shelf.items.push({x:shelf.usedWidth,y:shelf.y,w:pw,h:ph,devisId:p.devisId});
          shelf.usedWidth+=pw+kerf;
          placed=true; break;
        }
      }
      if(placed) break;
    }
    if(!placed){
      for(const [pw,ph] of orients){
        if(pw<=sheetW+0.01 && sheet.usedHeight+ph+kerf<=sheetH+0.01){
          sheet.shelves.push({y:sheet.usedHeight,height:ph,usedWidth:pw+kerf,items:[{x:0,y:sheet.usedHeight,w:pw,h:ph,devisId:p.devisId}]});
          sheet.usedHeight+=ph+kerf;
          placed=true; break;
        }
      }
    }
    if(!placed){
      newSheet();
      const orient=(p.w<=sheetW && p.h<=sheetH)?[p.w,p.h]:[p.h,p.w];
      sheet.shelves.push({y:0,height:orient[1],usedWidth:orient[0]+kerf,items:[{x:0,y:0,w:orient[0],h:orient[1],devisId:p.devisId}]});
      sheet.usedHeight=orient[1]+kerf;
    }
  });
  sheets.forEach(sh=>{
    sh.chutes=[];
    sh.shelves.forEach(shelf=>{
      const w=sheetW-shelf.usedWidth;
      if(w>1) sh.chutes.push({w:Math.round(w),h:Math.round(shelf.height),x:Math.round(shelf.usedWidth),y:Math.round(shelf.y)});
    });
    const hBas=sheetH-sh.usedHeight;
    if(hBas>1) sh.chutes.push({w:sheetW,h:Math.round(hBas),x:0,y:Math.round(sh.usedHeight)});
  });
  return sheets;
}

function renderTabChiffrage(){

async function enregistrerProduitConfigure(){
  const c=configState;
  const res=configResultat();
  const matByCat={structure:0,mobile:0,remplissage:0,quincaillerie:0};
  res.rows.forEach(r=>matByCat[classifyBOMLine(r[1])]+=r[4]);
  const labor=res.coutMateriel?c.laborRate*1.8:0;
  const direct=res.coutMateriel+labor+(+c.poseForfait||0);
  const indirect=direct*(c.tauxEnergie+c.tauxAmortissement+c.tauxTransport+c.tauxFraisAtelier+c.tauxFraisAdmin)/100;
  const total=direct+indirect;
  const sale=Math.round(total*(1+c.margin/100)*(1-Math.min(90,Math.max(0,c.remise))/100));
  const pctCout=sale?Math.round(res.coutMateriel/sale*100):60;
  const showLeaves=!c.type.startsWith('Moustiquaire')&&c.type!=='Fenêtre jalousie'&&c.type!=='Garde-corps inox';
  const standingLabel=c.standing&&c.standing!=='standard'?' — '+(COMPOSANT_STANDINGS[c.standing]?.label||''):'';
  const nom=`${c.type} ${c.w}×${c.h}mm${showLeaves&&c.leaves>1?' — '+c.leaves+' vantaux':''} (${c.serie})${standingLabel}`;
  const famille=PRODUIT_FAMILLES.includes(c.type)?c.type:'Autre';
  const rec={nom,famille,unite:'unite',prix_vente:sale,cout_materiel:res.coutMateriel,cout_materiel_pct:pctCout,alu_ml:res.alu,glass_m2:res.glassArea,config_json:c};
  let error;
  if(window._configEditId){
    ({error}=await sb.from('produits').update(rec).eq('id',window._configEditId));
  } else {
    ({error}=await sb.from('produits').insert(rec));
  }
  if(error){ toast(error.message,'error'); return; }
  toast(window._configEditId?'Produit mis à jour depuis le Bureau d\'études.':'Produit créé depuis le Bureau d\'études.');
  window._configEditId=null;
  showPage('produits');
}

  window._configEditId=id;
  showPage('produits-config');

async function saveDevis(){

function simpleHash(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; }
  return h.toString(16);
}
