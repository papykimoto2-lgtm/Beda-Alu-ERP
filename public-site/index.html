<style>
  :root{ --pc:#1D3557; --pc2:#0d1f38; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#f8fafc;min-height:100vh;margin:0;color:#1f2937;-webkit-font-smoothing:antialiased}
  .brand-bg{background:var(--pc)}
  .brand-text{color:var(--pc)}
  .brand-grad{background:linear-gradient(135deg,var(--pc),var(--pc2))}
  header.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #eef0f3}
  .nav-pill{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;border:0;background:none;font-family:inherit}
  .nav-pill.active{background:var(--pc);color:#fff}
  .nav-pill:hover:not(.active){background:#f3f4f6}
  .hero{position:relative;overflow:hidden;color:#fff;padding:76px 20px 60px;text-align:center}
  .hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--pc),var(--pc2) 75%);z-index:0}
  .hero::after{content:'';position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.16),transparent 42%),radial-gradient(circle at 88% 6%,rgba(255,255,255,.12),transparent 46%),radial-gradient(circle at 50% 130%,rgba(255,255,255,.10),transparent 55%)}
  .hero-inner{position:relative;z-index:1;max-width:600px;margin:0 auto}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;padding:7px 15px;border-radius:999px;margin-bottom:18px;text-transform:uppercase}
  .hero h1{font-size:32px;font-weight:900;margin:0 0 10px;letter-spacing:-.5px;line-height:1.15}
  .hero p{font-size:15px;opacity:.92;max-width:460px;margin:0 auto;line-height:1.55}
  .hero .cta{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
  .btn-cta{padding:12px 24px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s;font-family:inherit}
  .btn-cta:hover{transform:translateY(-1px)}
  .btn-cta.solid{background:#fff;color:var(--pc);box-shadow:0 10px 22px -10px rgba(0,0,0,.35)}
  .btn-cta.outline{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.5)}
  .hero-stats{position:relative;z-index:1;display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.18)}
  .hero-stat b{display:block;font-size:21px;font-weight:900}
  .hero-stat span{font-size:11px;opacity:.82;text-transform:uppercase;letter-spacing:.3px}
  .section{max-width:1000px;margin:0 auto;padding:44px 20px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--pc);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .eyebrow::before{content:'';width:18px;height:2px;background:var(--pc);border-radius:2px;flex:0 0 auto}
  .section-title{font-size:21px;font-weight:900;margin-bottom:6px;letter-spacing:-.3px}
  .section-sub{font-size:13px;color:#6b7280;margin-bottom:26px;max-width:520px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .service-card{transition:transform .18s,box-shadow .18s,border-color .18s}
  .service-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -14px rgba(15,23,42,.16);border-color:color-mix(in srgb,var(--pc) 30%,#e5e7eb)}
  .service-card .ic{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--pc) 12%,white);color:var(--pc);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
  .service-card .lbl{font-weight:700;font-size:13px}
  .gallery-item{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
  .gallery-item:hover img{transform:scale(1.08)}
  .gallery-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 72%);color:#fff;padding:16px 14px 10px;font-size:12px;font-weight:700}
  .timeline{margin:4px 0 20px}
  .tl-step{display:flex;gap:12px;position:relative;padding-bottom:20px}
  .tl-step:last-child{padding-bottom:0}
  .tl-step::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#e5e7eb}
  .tl-step:last-child::before{display:none}
  .tl-step.done::before{background:var(--pc)}
  .tl-dot{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#f1f5f9;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #e5e7eb;z-index:1}
  .tl-step.done .tl-dot{background:var(--pc);border-color:var(--pc);color:#fff}
  .tl-step.current .tl-dot{background:#fff;border-color:var(--pc);color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 18%,white)}
  .tl-label{font-size:13px;font-weight:700;padding-top:3px}
  .tl-step:not(.done):not(.current) .tl-label{color:#9ca3af;font-weight:600}
  .badge-status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
  .auth-card{max-width:420px;margin:24px auto 0;text-align:center}
  .auth-avatar{width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--pc) 12%,white);color:var(--pc);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px}
  .field-input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:13px;transition:border-color .15s,box-shadow .15s;font-family:inherit}
  .field-input:focus{outline:none;border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 15%,white)}
  .data-table{width:100%;border-collapse:collapse}
  .data-table th{text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#9ca3af;padding-bottom:10px}
  .data-table td{padding:10px 0;font-size:13px;border-top:1px solid #f1f5f9}
  .data-table tr:hover td{background:#fafbfc}
  footer.site-footer{background:#0f172a;color:#cbd5e1;padding:36px 20px 28px;text-align:center;font-size:12px}
  footer.site-footer a{color:#fff;text-decoration:none}
  .social-row{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .social-row a{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;transition:background .15s,transform .15s}
  .social-row a:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
  .fab-wa{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 10px 26px -6px rgba(22,163,74,.5);text-decoration:none;animation:pulseWa 2.6s ease-in-out infinite}
  @keyframes pulseWa{0%,100%{box-shadow:0 10px 26px -6px rgba(22,163,74,.5)}50%{box-shadow:0 10px 26px -6px rgba(22,163,74,.5),0 0 0 9px rgba(22,163,74,.14)}}
  .fade-in{animation:fadeInUp .5s ease both}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .filter-chip{padding:7px 15px;border-radius:999px;font-size:12px;font-weight:700;color:#4b5563;background:#f1f5f9;border:1px solid #e5e7eb;cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
  .filter-chip.active{background:var(--pc);color:#fff;border-color:var(--pc)}
  .filter-chip:hover:not(.active){border-color:color-mix(in srgb,var(--pc) 40%,#e5e7eb)}
  .product-item{background:#fff;border:1px solid #e5e7eb}
  .product-item img{object-fit:contain;padding:16px}
  .process-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
  .process-num{font-size:40px;font-weight:900;line-height:1;color:color-mix(in srgb,var(--pc) 18%,white);margin-bottom:8px}
  .cta-banner{background:linear-gradient(135deg,var(--pc),var(--pc2));border-radius:22px;padding:40px 24px;text-align:center;color:#fff}
  .cta-banner .eyebrow{color:rgba(255,255,255,.75)}
  .cta-banner .eyebrow::before{background:rgba(255,255,255,.6)}
  .dg-card{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .dg-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid color-mix(in srgb,var(--pc) 18%,white)}
  .dg-quote::before{content:'“';display:block;font-size:40px;line-height:.5;color:color-mix(in srgb,var(--pc) 32%,white);margin-bottom:8px;font-family:Georgia,serif}
  .dg-quote p{font-size:14px;line-height:1.7;color:#374151;font-style:italic;margin:0;white-space:pre-line}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .lightbox-box{max-width:880px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;position:relative}
  .lightbox-box img{width:100%;max-height:60vh;object-fit:contain;background:#0f172a;display:block}
  .lightbox-caption{padding:18px 20px}
  .lightbox-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;border:0;font-size:16px;cursor:pointer;z-index:2}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(15,23,42,.5);color:#fff;border:0;font-size:20px;cursor:pointer;z-index:2}
  .lightbox-prev{left:12px}
  .lightbox-next{right:12px}
  @media(max-width:640px){ .hero h1{font-size:24px} .hero-stats{gap:20px} }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} html{scroll-behavior:auto} }
</style>
</head>

/* ---------- Lightbox (réalisations & produits) ---------- */
let LB_LIST=[], LB_IDX=0;
function openLightbox(list,idx){ LB_LIST=list||[]; LB_IDX=idx||0; renderLightbox(); document.addEventListener('keydown',lbKeydown); }
function closeLightbox(){ const o=document.getElementById('lbOverlay'); if(o) o.remove(); document.removeEventListener('keydown',lbKeydown); }
function lbKeydown(e){ if(e.key==='Escape') closeLightbox(); else if(e.key==='ArrowRight') lbNav(1); else if(e.key==='ArrowLeft') lbNav(-1); }
function lbNav(dir){ if(!LB_LIST.length) return; LB_IDX=(LB_IDX+dir+LB_LIST.length)%LB_LIST.length; renderLightbox(); }
function renderLightbox(){
  const it=LB_LIST[LB_IDX]; if(!it) return;
  let o=document.getElementById('lbOverlay');
  if(!o){ o=document.createElement('div'); o.id='lbOverlay'; o.className='lightbox-overlay'; o.onclick=(e)=>{ if(e.target===o) closeLightbox(); }; document.body.appendChild(o); }
  o.innerHTML=`<div class="lightbox-box">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>
      ${LB_LIST.length>1?`<button class="lightbox-nav lightbox-prev" onclick="lbNav(-1)">‹</button><button class="lightbox-nav lightbox-next" onclick="lbNav(1)">›</button>`:''}
      ${it.img?`<img src="${it.img}" alt="">`:`<div style="height:220px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#9ca3af">Pas de photo</div>`}
      <div class="lightbox-caption">
        <div style="font-weight:800;font-size:15px">${esc(it.titre||'')}</div>
        ${it.famille?`<div style="font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.3px;margin-top:2px">${esc(it.famille)}</div>`:''}
        ${it.description?`<div style="font-size:13px;color:#4b5563;margin-top:10px;line-height:1.6;white-space:pre-line">${esc(it.description)}</div>`:''}
      </div>
    </div>`;
}

  const theme=document.querySelector('meta[name="theme-color"]'); if(theme) theme.setAttribute('content',b.couleur||'#1D3557');
  const ogT=document.querySelector('meta[property="og:title"]'); if(ogT) ogT.setAttribute('content',b.nom||'Portail client');
  const ogD=document.querySelector('meta[property="og:description"]'); if(ogD) ogD.setAttribute('content',b.slogan||b.nom||'');
  const ogI=document.querySelector('meta[property="og:image"]'); if(ogI&&b.logo) ogI.setAttribute('content',b.logo);

}

function setTab(key){
  document.querySelectorAll('.nav-pill').forEach(b=>b.classList.toggle('active',b.dataset.tab===key));
  const renderers={accueil:renderAccueil,realisations:renderGalerie,produits:renderProduits,apropos:renderAPropos,contact:renderContact,client:renderLogin};
  (renderers[key]||renderAccueil)();
  window.scrollTo({top:0,behavior:'smooth'});
}

    <div class="section fade-in">

      <div class="section-title">🛠️ Nos réalisations</div>

        <button class="filter-chip ${!famF?'active':''}" onclick="setGalFiltre('')">Toutes (${items.length})</button>
        ${familles.map(f=>`<button class="filter-chip ${famF===f?'active':''}" data-f="${esc(f)}" onclick="setGalFiltre(this.dataset.f)">${esc(f)} (${items.filter(r=>r.famille===f).length})</button>`).join('')}

function renderLogin(msg){
  document.getElementById('app').innerHTML=`
    <div class="section fade-in" style="max-width:480px">
      <div class="card auth-card">
        <div class="auth-avatar">👤</div>
        <h2 style="font-size:17px;font-weight:800;margin-bottom:4px">Mon dossier</h2>
        <p style="font-size:12px;color:#6b7280;margin-bottom:18px">Saisissez votre code client et votre numéro de téléphone pour suivre l'avancement de votre chantier.</p>
        ${msg?`<div style="font-size:13px;background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 12px;margin-bottom:14px;text-align:left">${esc(msg)}</div>`:''}
        <form id="loginForm" style="display:flex;flex-direction:column;gap:10px;text-align:left">
          <input id="fCode" class="field-input" placeholder="Code client (ex : C-42)" required>
          <input id="fTel" class="field-input" placeholder="Téléphone" required>
          <button type="submit" class="btn-cta" style="background:var(--pc);color:#fff;justify-content:center;margin-top:4px">Voir mon dossier</button>
        </form>
      </div>
    </div>`;
  document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const code=document.getElementById('fCode').value.trim();
    const tel=document.getElementById('fTel').value.trim();
    if(!code||!tel) return;
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Recherche…';
    try{
      const {data,error}=await sb.rpc('portail_lookup',{p_code:code,p_telephone:tel});
      if(error) throw error;
      if(data.disabled){ renderLogin('Le portail est momentanément indisponible.'); return; }
      if(!data.found){ renderLogin('Aucun dossier trouvé pour ces informations.'); return; }
      renderDossier(data);
    }catch(err){ renderLogin(err.message||'Erreur de connexion.'); }
  };
}
function renderDossier(data){
  const c=data.client;
  const nomComplet=[c.civilite,c.nom,c.prenoms].filter(Boolean).join(' ')||c.entreprise;
  const chantiersHtml=(data.projets||[]).map(p=>{
    const idx=ETAPES.indexOf(p.etape);
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div><div style="font-weight:700;font-size:14px">${esc(p.libelle)}</div><div style="font-size:11px;color:#9ca3af">${esc(p.code)}${p.commune?' · '+esc(p.commune):''}</div></div>
        ${p.etape==='annule'?badge('annule'):''}
      </div>
      ${idx>=0?`<div class="timeline">${ETAPES.map((et,i)=>`<div class="tl-step ${i<idx?'done':i===idx?'current':''}"><div class="tl-dot">${i<idx?'✓':(i+1)}</div><div class="tl-label">${esc(ETAPE_LABELS[et])}</div></div>`).join('')}</div>`:''}
    </div>`;
  }).join('')||'<div style="font-size:13px;color:#9ca3af;margin-bottom:14px">Aucun chantier enregistré.</div>';
  const rowsTable=(arr,cols)=>arr.map(r=>`<tr>${cols.map(c=>`<td>${c(r)}</td>`).join('')}</tr>`).join('')||`<tr><td style="padding:14px 0;font-size:13px;color:#9ca3af;border-top:1px solid #f1f5f9" colspan="${cols.length}">Aucun élément.</td></tr>`;
  document.getElementById('app').innerHTML=`
    <div class="section fade-in" style="max-width:640px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div><div style="font-size:19px;font-weight:800">${esc(nomComplet)}</div><div style="font-size:11px;color:#9ca3af">${esc(c.code)}</div></div>
        <button onclick="renderLogin()" style="font-size:11px;color:#6b7280;background:none;border:0;cursor:pointer;font-family:inherit">← Autre dossier</button>
      </div>
      <h3 style="font-size:12px;font-weight:800;text-transform:uppercase;color:#6b7280;margin-bottom:10px;letter-spacing:.3px">🏗️ Mes chantiers</h3>
      ${chantiersHtml}
      <h3 style="font-size:12px;font-weight:800;text-transform:uppercase;color:#6b7280;margin-bottom:10px;margin-top:8px;letter-spacing:.3px">📄 Mes devis</h3>
      <div class="card" style="margin-bottom:14px;overflow-x:auto"><table class="data-table"><thead><tr><th>Code</th><th>Libellé</th><th>Statut</th><th style="text-align:right">Montant</th></tr></thead><tbody>
        ${rowsTable(data.devis,[d=>esc(d.code),d=>esc(d.libelle||'—'),d=>badge(d.statut),d=>'<span style="display:block;text-align:right;font-weight:700">'+money(d.total)+'</span>'])}
      </tbody></table></div>
      <h3 style="font-size:12px;font-weight:800;text-transform:uppercase;color:#6b7280;margin-bottom:10px;letter-spacing:.3px">🧾 Mes factures</h3>
      <div class="card" style="overflow-x:auto"><table class="data-table"><thead><tr><th>Code</th><th>Date</th><th>Statut</th><th style="text-align:right">Montant</th></tr></thead><tbody>
        ${rowsTable(data.factures,[f=>esc(f.code),f=>fmtDate(f.date_facture),f=>badge(f.statut),f=>'<span style="display:block;text-align:right;font-weight:700">'+money(f.total)+'</span>'])}
      </tbody></table></div>
    </div>`;
}

renderHeader();
setTab('accueil');
</script>
